<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>s6 - Lemo Ink Wash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0B0F1A; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Deterministic PRNG (mulberry32)
function mulberry(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(n) {
  let x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
  return x - Math.floor(x);
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); }
function easeInOutQuad(t) { t = clamp(t, 0, 1); return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2; }

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Precompute deterministic mountain ridges & brushstrokes
const rng = mulberry(20261120);

function makeRidge(baseY, amp, freq, pts, seed) {
  const arr = [];
  for (let i = 0; i <= pts; i++) {
    const u = i / pts;
    const n1 = Math.sin(u * Math.PI * freq + seed) * amp;
    const n2 = Math.sin(u * Math.PI * freq * 2.3 + seed * 1.7) * (amp * 0.42);
    const n3 = (hash(i * 13.7 + seed) - 0.5) * (amp * 0.16);
    arr.push({ x: u, y: baseY + n1 + n2 + n3 });
  }
  return arr;
}

const farRidge = makeRidge(0.40, 0.08, 2.2, 64, 1.3);
const midRidge = makeRidge(0.51, 0.10, 2.7, 72, 4.1);
const nearRidge = makeRidge(0.64, 0.075, 1.9, 80, 7.8);

// Precompute bristles for a loaded ink brushstroke
function drawBrushStroke(ctx, points, width, color, alpha, progress, seed, dry = 0.25) {
  if (progress <= 0.001 || points.length < 2) return;
  const maxIdx = Math.max(1, Math.floor((points.length - 1) * clamp(progress, 0, 1)));
  const bristles = 14;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let b = 0; b < bristles; b++) {
    const offsetFrac = (b / (bristles - 1)) - 0.5;
    const bSeed = seed * 31 + b * 17;
    // Loaded stroke: darker/denser on one edge
    const edgeWeight = b < 3 ? 1.25 : (1.0 - Math.abs(offsetFrac) * 0.6);
    const bAlpha = alpha * edgeWeight * (0.45 + 0.55 * hash(bSeed));
    ctx.strokeStyle = color;
    ctx.globalAlpha = clamp(bAlpha, 0, 1);

    ctx.beginPath();
    let penDown = false;
    for (let i = 0; i <= maxIdx; i++) {
      const p = points[i];
      const u = i / (points.length - 1);
      // Taper entry & exit
      const pressure = Math.sin(Math.pow(u, 0.85) * Math.PI);
      const w = width * (0.25 + 0.85 * pressure);
      // Flying white (feibai) breaks on long-scale noise
      const inkLoad = 1.0 - u * 0.35;
      const gapNoise = hash(bSeed + Math.floor(u * 18));
      if (gapNoise < dry * (1 - inkLoad + 0.35) && b > 2) {
        penDown = false;
        continue;
      }
      const nx = (i < points.length - 1) ? -(points[i+1].y - p.y) : 0;
      const ny = (i < points.length - 1) ? (points[i+1].x - p.x) : 1;
      const len = Math.hypot(nx, ny) || 1;
      const px = p.x + (nx / len) * offsetFrac * w;
      const py = p.y + (ny / len) * offsetFrac * w;
      if (!penDown) {
        ctx.moveTo(px, py);
        penDown = true;
      } else {
        ctx.lineTo(px, py);
      }
    }
    ctx.lineWidth = Math.max(1.5, width / bristles * 1.45);
    ctx.stroke();
  }
  ctx.restore();
}

// Precompute cun (texture) strokes on mountains
const cunStrokes = [];
for (let i = 0; i < 42; i++) {
  const u = 0.08 + rng() * 0.84;
  const idx = Math.floor(u * (midRidge.length - 1));
  const topY = midRidge[idx].y;
  const len = 0.05 + rng() * 0.09;
  const pts = [];
  for (let k = 0; k <= 6; k++) {
    const f = k / 6;
    pts.push({
      x: u - f * 0.03 + (hash(i * 19 + k) - 0.5) * 0.008,
      y: topY + 0.015 + f * len
    });
  }
  cunStrokes.push({ pts, w: 12 + rng() * 18, delay: 0.12 + rng() * 0.45, seed: i + 100 });
}

// Moss dots (taidian)
const mossDots = [];
for (let i = 0; i < 55; i++) {
  const u = 0.06 + rng() * 0.88;
  const idx = Math.floor(u * (nearRidge.length - 1));
  mossDots.push({
    x: u,
    y: nearRidge[idx].y + (rng() - 0.3) * 0.025,
    r: 4 + rng() * 9,
    delay: 0.35 + rng() * 0.45
  });
}

// Paper fibres
const fibres = [];
for (let i = 0; i < 160; i++) {
  fibres.push({
    x: rng(), y: rng(),
    len: 0.01 + rng() * 0.035,
    ang: rng() * Math.PI * 2,
    alpha: 0.025 + rng() * 0.035
  });
}

window.DUR = 4.0;
window.READY = false;

window.render = function(t) {
  const W = window.innerWidth || 1440;
  const H = window.innerHeight || 2560;
  if (canvas.width !== W || canvas.height !== H) {
    canvas.width = W;
    canvas.height = H;
  }

  const p = clamp(t / window.DUR, 0, 1);
  // Subtle continuous camera push-in + handscroll drift (no dead frames)
  const camScale = 1.0 + 0.06 * easeInOutQuad(p);
  const camPanX = lerp(24, -24, p);
  const camPanY = lerp(14, -18, p);

  // 1. Ground: studio-at-night ink with soft radial light pool
  ctx.fillStyle = '#0B0F1A';
  ctx.fillRect(0, 0, W, H);

  const pool = ctx.createRadialGradient(W * 0.52, H * 0.46, W * 0.05, W * 0.52, H * 0.46, H * 0.65);
  pool.addColorStop(0, '#1B243B');
  pool.addColorStop(0.55, '#111829');
  pool.addColorStop(1, '#0B0F1A');
  ctx.fillStyle = pool;
  ctx.fillRect(0, 0, W, H);

  // Rice-paper texture fibres (subtle, warm paper tint)
  ctx.save();
  ctx.strokeStyle = '#F4EFE6';
  ctx.lineWidth = 1.2;
  for (const f of fibres) {
    ctx.globalAlpha = f.alpha;
    ctx.beginPath();
    ctx.moveTo(f.x * W, f.y * H);
    ctx.lineTo((f.x + Math.cos(f.ang) * f.len) * W, (f.y + Math.sin(f.ang) * f.len * 0.6) * H);
    ctx.stroke();
  }
  ctx.restore();

  // World transform for camera move
  ctx.save();
  ctx.translate(W * 0.5 + camPanX, H * 0.5 + camPanY);
  ctx.scale(camScale, camScale);
  ctx.translate(-W * 0.5, -H * 0.5);

  // 2. Warm Amber Moon / Ink Bloom behind mountains
  const moonP = easeOutCubic(clamp((p + 0.15) / 0.55, 0, 1));
  const moonX = W * 0.68;
  const moonY = H * 0.34;
  const moonR = W * 0.14 * moonP;
  const moonGlow = ctx.createRadialGradient(moonX, moonY, moonR * 0.2, moonX, moonY, moonR * 2.6);
  moonGlow.addColorStop(0, 'rgba(255, 181, 71, 0.32)');
  moonGlow.addColorStop(0.45, 'rgba(255, 181, 71, 0.08)');
  moonGlow.addColorStop(1, 'rgba(255, 181, 71, 0)');
  ctx.fillStyle = moonGlow;
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR * 2.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.globalAlpha = 0.85 * moonP;
  ctx.fillStyle = '#FFB547';
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR * 0.62, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 3. Far mountain wash (pale paper-mist silhouette)
  const farP = easeOutCubic(clamp((p + 0.18) / 0.50, 0, 1));
  ctx.save();
  ctx.globalAlpha = 0.28 * farP;
  const farGrad = ctx.createLinearGradient(0, H * 0.30, 0, H * 0.58);
  farGrad.addColorStop(0, '#F4EFE6');
  farGrad.addColorStop(0.6, 'rgba(244, 239, 230, 0.12)');
  farGrad.addColorStop(1, 'rgba(244, 239, 230, 0)');
  ctx.fillStyle = farGrad;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.60);
  for (const pt of farRidge) {
    ctx.lineTo(pt.x * W, pt.y * H);
  }
  ctx.lineTo(W, H * 0.60);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 4. Mid mountain body + loaded brush ridge stroke
  const midP = easeOutCubic(clamp((p + 0.10) / 0.55, 0, 1));
  ctx.save();
  ctx.globalAlpha = 0.65 * midP;
  const midGrad = ctx.createLinearGradient(0, H * 0.40, 0, H * 0.72);
  midGrad.addColorStop(0, '#2B3654');
  midGrad.addColorStop(0.55, '#182036');
  midGrad.addColorStop(1, 'rgba(11, 15, 26, 0)');
  ctx.fillStyle = midGrad;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.72);
  for (const pt of midRidge) {
    ctx.lineTo(pt.x * W, pt.y * H);
  }
  ctx.lineTo(W, H * 0.72);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  const midScreenPts = midRidge.map(pt => ({ x: pt.x * W, y: pt.y * H }));
  drawBrushStroke(ctx, midScreenPts, 28, '#F4EFE6', 0.42, midP, 7, 0.38);

  // Cun texture strokes
  for (const cs of cunStrokes) {
    const cp = easeOutCubic(clamp((p - cs.delay) / 0.35, 0, 1));
    const sPts = cs.pts.map(pt => ({ x: pt.x * W, y: pt.y * H }));
    drawBrushStroke(ctx, sPts, cs.w, '#0B0F1A', 0.55, cp, cs.seed, 0.45);
  }

  // 5. Near foreground ridge + moss dots
  const nearP = easeOutCubic(clamp((p - 0.05) / 0.55, 0, 1));
  ctx.save();
  ctx.globalAlpha = 0.92 * nearP;
  const nearGrad = ctx.createLinearGradient(0, H * 0.55, 0, H * 0.85);
  nearGrad.addColorStop(0, '#121828');
  nearGrad.addColorStop(0.6, '#0B0F1A');
  nearGrad.addColorStop(1, '#0B0F1A');
  ctx.fillStyle = nearGrad;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.85);
  for (const pt of nearRidge) {
    ctx.lineTo(pt.x * W, pt.y * H);
  }
  ctx.lineTo(W, H * 0.85);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  const nearScreenPts = nearRidge.map(pt => ({ x: pt.x * W, y: pt.y * H }));
  drawBrushStroke(ctx, nearScreenPts, 34, '#FFB547', 0.28, nearP, 23, 0.42);
  drawBrushStroke(ctx, nearScreenPts, 24, '#06080F', 0.85, nearP, 29, 0.20);

  for (const md of mossDots) {
    const mp = easeOutCubic(clamp((p - md.delay) / 0.15, 0, 1));
    if (mp <= 0) continue;
    ctx.save();
    ctx.globalAlpha = 0.78 * mp;
    ctx.fillStyle = '#070A12';
    ctx.beginPath();
    ctx.ellipse(md.x * W, md.y * H, md.r * mp * 1.2, md.r * mp * 0.75, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 6. Xieyi tiny film crew on the near ridge (steps on twos at 12fps for character charm)
  const tStepped = Math.floor(t * 12) / 12;
  const crewP = easeOutCubic(clamp((p - 0.22) / 0.35, 0, 1));
  if (crewP > 0.01) {
    const crewX = W * 0.36;
    const crewIdx = Math.floor(0.36 * (nearRidge.length - 1));
    const crewY = nearRidge[crewIdx].y * H - 6;

    // Operator figure (xieyi brushstrokes)
    const bob = Math.sin(tStepped * 4.5) * 3;
    drawBrushStroke(ctx, [
      { x: crewX - 55, y: crewY },
      { x: crewX - 58, y: crewY - 82 * crewP + bob }
    ], 18, '#F4EFE6', 0.88, crewP, 101, 0.15);
    // Head
    ctx.save();
    ctx.globalAlpha = 0.9 * crewP;
    ctx.fillStyle = '#F4EFE6';
    ctx.beginPath();
    ctx.arc(crewX - 56, crewY - 102 * crewP + bob, 14 * crewP, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Tripod + Camera
    drawBrushStroke(ctx, [
      { x: crewX - 24, y: crewY },
      { x: crewX, y: crewY - 76 * crewP },
      { x: crewX + 24, y: crewY }
    ], 8, '#F4EFE6', 0.85, crewP, 103, 0.1);
    // Camera body + amber lens beam
    ctx.save();
    ctx.globalAlpha = 0.95 * crewP;
    ctx.fillStyle = '#F4EFE6';
    ctx.fillRect(crewX - 18, crewY - 102 * crewP, 42, 26);
    ctx.fillStyle = '#FFB547';
    ctx.beginPath();
    ctx.arc(crewX + 28, crewY - 89 * crewP, 7 * crewP, 0, Math.PI * 2);
    ctx.fill();
    // Subtle amber projection cone
    const beam = ctx.createLinearGradient(crewX + 28, crewY - 89 * crewP, crewX + 280, crewY - 140);
    beam.addColorStop(0, 'rgba(255, 181, 71, 0.30)');
    beam.addColorStop(1, 'rgba(255, 181, 71, 0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(crewX + 28, crewY - 94 * crewP);
    ctx.lineTo(crewX + 280, crewY - 190);
    ctx.lineTo(crewX + 280, crewY - 30);
    ctx.lineTo(crewX + 28, crewY - 84 * crewP);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Boom operator
    const boomSwing = Math.sin(tStepped * 3.0) * 6;
    drawBrushStroke(ctx, [
      { x: crewX + 95, y: crewY + 4 },
      { x: crewX + 92, y: crewY - 78 * crewP }
    ], 16, '#F4EFE6', 0.82, crewP, 107, 0.15);
    ctx.save();
    ctx.globalAlpha = 0.85 * crewP;
    ctx.fillStyle = '#F4EFE6';
    ctx.beginPath();
    ctx.arc(crewX + 92, crewY - 96 * crewP, 13 * crewP, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    drawBrushStroke(ctx, [
      { x: crewX + 108, y: crewY - 58 * crewP },
      { x: crewX + 24, y: crewY - 142 * crewP + boomSwing }
    ], 6, '#FFB547', 0.80, crewP, 109, 0.1);
  }

  // 7. Mist band drifting horizontally
  ctx.save();
  const mistOffset = lerp(-120, 120, p);
  const mistGrad = ctx.createLinearGradient(0, H * 0.50, 0, H * 0.64);
  mistGrad.addColorStop(0, 'rgba(244, 239, 230, 0)');
  mistGrad.addColorStop(0.5, 'rgba(244, 239, 230, 0.08)');
  mistGrad.addColorStop(1, 'rgba(244, 239, 230, 0)');
  ctx.fillStyle = mistGrad;
  ctx.fillRect(mistOffset - 150, H * 0.50, W + 300, H * 0.14);
  ctx.restore();

  ctx.restore(); // end camera world transform

  // 8. Screen-space Typography + Amber Seal (safe zones: top > 200px, bottom < 1990px, sides > 96px)
  const textP = easeOutCubic(clamp((p - 0.08) / 0.25, 0, 1));
  const textSlide = lerp(110, 0, textP);
  ctx.save();
  ctx.translate(0, textSlide);
  ctx.globalAlpha = clamp(textP * 1.15, 0, 1);

  // Headline in upper paper space
  ctx.fillStyle = '#F4EFE6';
  ctx.font = '900 132px Montserrat, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('INK.', 112, 430);
  ctx.fillStyle = '#FFB547';
  ctx.fillText('PAPER.', 112, 575);
  ctx.fillStyle = '#F4EFE6';
  ctx.fillText('PRINT.', 112, 720);

  // Small Amber Seal (hanko) next to title
  const sealP = easeOutCubic(clamp((p - 0.30) / 0.20, 0, 1));
  if (sealP > 0.01) {
    const sx = 1180, sy = 360, sSize = 104;
    ctx.save();
    ctx.translate(sx + sSize/2, sy + sSize/2);
    ctx.scale(lerp(1.6, 1.0, sealP), lerp(1.6, 1.0, sealP));
    ctx.translate(-sSize/2, -sSize/2);
    ctx.strokeStyle = '#FFB547';
    ctx.lineWidth = 6;
    ctx.strokeRect(0, 0, sSize, sSize);
    ctx.fillStyle = '#FFB547';
    ctx.font = '700 44px "FiraCode Nerd Font", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('墨', sSize/2, sSize/2 + 2);
    ctx.restore();
  }
  ctx.restore();

  // Bottom-above-safe-zone skill tag (above y=1990)
  const tagP = easeOutCubic(clamp((p - 0.18) / 0.25, 0, 1));
  ctx.save();
  ctx.globalAlpha = 0.88 * tagP;
  ctx.fillStyle = '#5EE6FF';
  ctx.font = '600 54px "FiraCode Nerd Font", monospace';
  ctx.textAlign = 'left';
  ctx.fillText('LEMO-OPUSCAR // INK-WASH', 112, 1890);
  ctx.restore();
};

document.fonts.ready.then(() => {
  window.READY = true;
  window.render(0);
});
</script>
</body>
</html>
