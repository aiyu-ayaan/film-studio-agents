<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=2560" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #0b0f1a;
        --ink-lift: #141a2b;
        --paper: #f4efe6;
        --slop: #8a8f99;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1440px;
        height: 2560px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
      }
      #pool {
        position: absolute;
        left: -400px;
        top: -200px;
        width: 2240px;
        height: 2600px;
        background: radial-gradient(
          ellipse 50% 42% at 50% 45%,
          var(--ink-lift) 0%,
          rgba(20, 26, 43, 0.55) 45%,
          rgba(11, 15, 26, 0) 100%
        );
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 70% at 50% 42%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
        pointer-events: none;
      }
      /* stage: perspective space for the slide and its shards */
      #stage {
        position: absolute;
        inset: 0;
        perspective: 1700px;
        perspective-origin: 50% 40%;
        --split: 0px;
        --dim: 1;
        --hf-glitch-red: 0px;
        --hf-glitch-blue: 0px;
        --hf-glitch-reach: 1;
      }
      #shadow {
        position: absolute;
        left: 160px;
        top: 1600px;
        width: 1120px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0) 70%);
        filter: blur(30px);
      }
      #card {
        position: absolute;
        left: 100px;
        top: 300px;
        width: 1240px;
        height: 1440px;
        transform-style: preserve-3d;
      }
      .shard {
        position: absolute;
        left: 0;
        top: 0;
        width: 1240px;
        height: 1440px;
        filter: brightness(var(--dim)) drop-shadow(calc(var(--split) * -1) 0 0 rgba(255, 40, 90, 0.7))
          drop-shadow(var(--split) 0 0 rgba(40, 220, 255, 0.7));
      }
      /* the deliberately generic "AI slide" */
      .slide {
        position: absolute;
        inset: 0;
        border-radius: 36px;
        background: linear-gradient(180deg, #9aa0aa 0%, #8a8f99 100%);
        color: #2e3239;
        font-family: sans-serif;
        overflow: hidden;
      }
      .slide .counter {
        position: absolute;
        right: 80px;
        top: 70px;
        font-family: monospace;
        font-size: 52px;
        color: #50555e;
      }
      .slide .logo-dot {
        position: absolute;
        left: 96px;
        top: 76px;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #6c717b;
      }
      .hf-catalog-rgb-glitch-text {
        position: absolute;
        left: 96px;
        top: 230px;
        width: 1048px;
        height: 300px;
        font-family: sans-serif;
        font-weight: 700;
        font-size: 124px;
        line-height: 1.12;
        letter-spacing: -0.01em;
        color: #24272d;
      }
      .hf-catalog-rgb-glitch-text span,
      .hf-catalog-rgb-glitch-text strong {
        position: absolute;
        inset: 0;
        font-weight: 700;
      }
      .hf-catalog-rgb-glitch-text span:first-child {
        color: #ef4444;
        transform: translateX(calc(var(--hf-glitch-red, 0px) * var(--hf-glitch-reach, 1)));
      }
      .hf-catalog-rgb-glitch-text span:nth-child(2) {
        color: #22d3ee;
        transform: translateX(calc(var(--hf-glitch-blue, 0px) * var(--hf-glitch-reach, 1)));
      }
      .hf-catalog-rgb-glitch-text strong {
        color: #24272d;
      }
      .slide .sub {
        position: absolute;
        left: 96px;
        top: 560px;
        width: 1000px;
        font-size: 54px;
        line-height: 1.3;
        color: #4a4f58;
      }
      .slide .stock {
        position: absolute;
        left: 96px;
        top: 780px;
        width: 1048px;
        height: 430px;
        border-radius: 44px;
        background: #a7adb6;
        box-shadow: 0 18px 40px rgba(40, 44, 52, 0.25);
      }
      .slide .stock .dot {
        position: absolute;
        left: 72px;
        top: 76px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #6f9a7a;
      }
      .slide .stock .label {
        position: absolute;
        left: 144px;
        top: 66px;
        font-size: 56px;
        color: #3a3e45;
      }
      .slide .stock .bar {
        position: absolute;
        left: 72px;
        height: 34px;
        border-radius: 17px;
        background: #8d929c;
      }
      .slide .progress {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 96px;
        height: 10px;
        border-radius: 5px;
        background: #767b85;
        overflow: hidden;
      }
      .slide .progress i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 100%;
        background: #3f434b;
        transform-origin: 0 50%;
        transform: scaleX(var(--prog, 0.2));
      }
      /* tear bars + scanlines during the glitch */
      .tear {
        position: absolute;
        left: 0;
        width: 1440px;
        height: 0px;
        background: rgba(200, 205, 215, 0.35);
        mix-blend-mode: screen;
      }
      #scan {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0 3px, transparent 3px 7px);
        pointer-events: none;
      }
      #wave {
        position: absolute;
        left: 100px;
        top: 1790px;
        width: 1240px;
        height: 150px;
        overflow: hidden;
      }
      #wave svg {
        position: absolute;
        left: 0;
        top: 0;
      }
      /* grain (registry: grain-overlay), tuned to ~3% */
      @keyframes hf-grain-noise {
        0%,
        100% {
          transform: translate(0, 0);
        }
        10% {
          transform: translate(-5%, -5%);
        }
        20% {
          transform: translate(-10%, 5%);
        }
        30% {
          transform: translate(5%, -10%);
        }
        40% {
          transform: translate(-5%, 15%);
        }
        50% {
          transform: translate(-10%, 5%);
        }
        60% {
          transform: translate(15%, 0);
        }
        70% {
          transform: translate(0, 10%);
        }
        80% {
          transform: translate(-15%, 0);
        }
        90% {
          transform: translate(10%, 5%);
        }
      }
      #grain-overlay .grain-texture {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.06;
        animation: hf-grain-noise 0.5s steps(1) infinite;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.6" data-width="1440" data-height="2560">
      <div id="pool"></div>
      <div id="stage">
        <div id="shadow"></div>
        <div id="card"></div>
        <div id="wave">
          <svg width="1240" height="150" viewBox="0 0 1240 150">
            <path id="wave-path" d="" fill="none" stroke="#a9aeb8" stroke-width="6" stroke-linejoin="miter" />
          </svg>
        </div>
      </div>
      <div class="tear" id="tear0"></div>
      <div class="tear" id="tear1"></div>
      <div class="tear" id="tear2"></div>
      <div id="scan"></div>
      <div id="vignette"></div>
      <div id="grain-overlay" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
        <div class="grain-texture"></div>
      </div>
    </div>

    <template id="slide-tpl">
      <div class="slide">
        <div class="logo-dot"></div>
        <div class="counter">02 / 05</div>
        <div class="hf-catalog-rgb-glitch-text">
          <span>Introducing Our Platform</span><span>Introducing Our Platform</span
          ><strong>Introducing Our Platform</strong>
        </div>
        <div class="sub">Empowering seamless solutions for a better tomorrow.</div>
        <div class="stock">
          <div class="dot"></div>
          <div class="label">Status: Active</div>
          <div class="bar" style="top: 190px; width: 820px"></div>
          <div class="bar" style="top: 260px; width: 700px"></div>
          <div class="bar" style="top: 330px; width: 520px"></div>
        </div>
        <div class="progress"><i></i></div>
      </div>
    </template>

    <script>
      (function () {
        const FPS = 30;
        const W = 1240,
          H = 1440;
        // seeded RNG (determinism)
        let seed = 20261120;
        const rnd = () => {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const rr = (a, b) => a + (b - a) * rnd();

        // ---- build jittered shard grid: 3 cols x 5 rows of quads, each split into 2 triangles
        const COLS = 3,
          ROWS = 5;
        const pts = [];
        for (let r = 0; r <= ROWS; r++) {
          pts.push([]);
          for (let c = 0; c <= COLS; c++) {
            let x = (c / COLS) * W,
              y = (r / ROWS) * H;
            if (c > 0 && c < COLS) x += rr(-110, 110);
            if (r > 0 && r < ROWS) y += rr(-70, 70);
            // overshoot outer edge so rounded corners stay intact
            if (c === 0) x = -40;
            if (c === COLS) x = W + 40;
            if (r === 0) y = -40;
            if (r === ROWS) y = H + 40;
            pts[r].push([x, y]);
          }
        }
        const tpl = document.getElementById("slide-tpl");
        const card = document.getElementById("card");
        const shards = [];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const a = pts[r][c],
              b = pts[r][c + 1],
              d = pts[r + 1][c],
              e = pts[r + 1][c + 1];
            const flip = (r + c) % 2 === 0;
            const tris = flip
              ? [
                  [a, b, e],
                  [a, e, d],
                ]
              : [
                  [a, b, d],
                  [b, e, d],
                ];
            for (const tri of tris) {
              const el = document.createElement("div");
              el.className = "shard";
              el.style.clipPath =
                "polygon(" + tri.map((p) => p[0].toFixed(1) + "px " + p[1].toFixed(1) + "px").join(",") + ")";
              const cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3,
                cy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
              el.style.transformOrigin = cx.toFixed(1) + "px " + cy.toFixed(1) + "px";
              el.appendChild(tpl.content.cloneNode(true));
              card.appendChild(el);
              shards.push({ el, row: r, cx, cy });
            }
          }
        }
        const stage = document.getElementById("stage");
        const q = (sel) => Array.from(card.querySelectorAll(sel));

        const tl = gsap.timeline({ paused: true });

        // ---- ground: light pool drifts, keeps every frame alive
        tl.fromTo("#pool", { x: -60, y: 20 }, { x: 80, y: -40, duration: 5.8, ease: "none" }, 0);

        // ---- stiff linear slide-in, with a stutter (held frames) in the middle
        const stutter = (p) => {
          if (p > 0.35 && p < 0.8) return Math.floor((p * 30) / 3) * 3 / 30; // 3-frame holds
          return p;
        };
        tl.fromTo("#card", { x: 900, rotationY: -6 }, { x: 0, rotationY: 0, duration: 1.0, ease: stutter }, 0);
        tl.fromTo("#shadow", { x: 900 }, { x: 0, duration: 1.0, ease: stutter }, 0);
        // generic, mechanical idle drift (linear)
        tl.fromTo("#card", { y: 0 }, { y: -36, duration: 2.4, ease: "steps(16)" }, 1.0);

        // ---- inner items pop in linearly, the template way
        tl.fromTo(q(".hf-catalog-rgb-glitch-text"), { x: -160 }, { x: 0, duration: 0.5, ease: "none" }, 0.25);
        tl.fromTo(q(".sub"), { x: -160 }, { x: 0, duration: 0.5, ease: "none" }, 0.45);
        tl.fromTo(q(".stock"), { y: 160, scale: 0.94 }, { y: 0, scale: 1, duration: 0.5, ease: "none" }, 0.65);
        tl.fromTo(q(".stock .dot"), { scale: 1 }, { scale: 1.25, duration: 0.3, ease: "none", yoyo: true, repeat: 5 }, 1.0);
        tl.fromTo(q(".progress i"), { scaleX: 0.2 }, { scaleX: 0.4, duration: 2.6, ease: "steps(8)" }, 0);

        // ---- robotic waveform: flat, regular, lifeless; enters from the left edge at 2.6 s
        const wavePath = document.getElementById("wave-path");
        const waveState = { t: 0, amp: 0 };
        const drawWave = () => {
          const ph = waveState.t;
          let d = "";
          for (let x = 0; x <= 1240; x += 8) {
            // square-ish monotone pulses: same height, same spacing
            const s = Math.sin((x + ph * 520) / 34);
            const y = 75 - waveState.amp * Math.sign(s) * Math.min(1, Math.abs(s) * 3);
            d += (x === 0 ? "M" : "L") + x + " " + y.toFixed(1);
          }
          wavePath.setAttribute("d", d);
        };
        drawWave();
        tl.fromTo("#wave", { x: -1340 }, { x: 0, duration: 0.33, ease: "expo.out" }, 2.6);
        tl.fromTo(waveState, { t: 0 }, { t: 3.0, duration: 3.0, ease: "none", onUpdate: drawWave }, 2.6);
        tl.fromTo(waveState, { amp: 26 }, { amp: 26, duration: 0.01, onUpdate: drawWave }, 2.6);
        tl.to(waveState, { amp: 3, duration: 1.4, ease: "power2.in", onUpdate: drawWave }, 3.8);

        // ---- glitch: per-frame seeded RGB split, row tears, tear bars (registry rgb-glitch-text + aberration recipe)
        const tears = ["#tear0", "#tear1", "#tear2"].map((s) => document.querySelector(s));
        const g0 = 2.68,
          g1 = 4.4;
        for (let f = Math.round(g0 * FPS); f <= Math.round(g1 * FPS); f++) {
          const t = f / FPS;
          const k = Math.min(1, (t - g0) / 0.6); // ramps up
          const fade = t > 3.9 ? Math.max(0, 1 - (t - 3.9) / 0.5) : 1;
          const on = rnd() < 0.25 + 0.65 * k;
          const amt = on ? k * fade : 0.1 * k * fade;
          tl.set(
            stage,
            {
              "--split": (rr(6, 34) * amt).toFixed(1) + "px",
              "--hf-glitch-red": (-rr(8, 40) * amt).toFixed(1) + "px",
              "--hf-glitch-blue": (rr(8, 40) * amt).toFixed(1) + "px",
            },
            t
          );
          tl.set("#scan", { opacity: on ? 0.5 * fade : 0.15 * fade }, t);
          // row tears (only before the collapse takes over the shard transforms)
          if (t < 3.5) {
            for (let r = 0; r < ROWS; r++) {
              const dx = on && rnd() < 0.55 ? rr(-130, 130) * k : 0;
              shards.filter((s) => s.row === r).forEach((s) => tl.set(s.el, { x: dx }, t));
            }
          }
          tears.forEach((el) => {
            const show = on && rnd() < 0.6;
            tl.set(el, { y: rr(300, 1760), height: show ? rr(4, 46) * fade : 0, x: rr(-60, 60) }, t);
          });
        }
        tl.set(tears, { height: 0 }, g1 + 0.04);

        // ---- collapse: slide folds toward camera and breaks into black-ink shards
        tl.to("#card", { rotationX: -14, y: -60, duration: 0.5, ease: "power2.in" }, 3.2);
        tl.to(stage, { "--dim": 0.14, duration: 1.2, ease: "power2.in" }, 3.4);
        tl.to("#shadow", { scaleX: 1.6, opacity: 0, duration: 1.0, ease: "power2.in" }, 3.5);
        const ccx = W / 2,
          ccy = H * 0.45;
        shards.forEach((s, i) => {
          const dx = s.cx - ccx,
            dy = s.cy - ccy;
          const dist = Math.hypot(dx, dy) || 1;
          const delay = 3.5 + (1 - dist / 900) * 0.25 + rr(0, 0.12);
          tl.to(
            s.el,
            {
              x: (dx / dist) * rr(500, 1100),
              y: (dy / dist) * rr(400, 1000) + rr(-80, 160),
              z: rr(500, 1300),
              rotationX: rr(-80, 80),
              rotationY: rr(-90, 90),
              rotation: rr(-50, 50),
              duration: 2.4, // runs past 5.6 s so the last frames are still moving
              ease: "power2.in",
            },
            delay
          );
        });

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
