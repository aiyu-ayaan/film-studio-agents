<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>film-studio</title>
<style>
  :root {
    --ink: #0B0F1A; --ink2: #141A2B; --card: #182036; --line: #263152;
    --paper: #F4EFE6; --dim: #9AA3BC; --amber: #FFB547; --cyan: #5EE6FF;
    --mm: #FFB547; --hf: #5EE6FF; --sc: #FF7AA8; --lemo: #9DF27A; --three: #B79CFF; --rem: #6FA8FF; --ear: #FFD97A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; background: var(--ink); }
  body {
    font-family: Montserrat, sans-serif; color: var(--paper);
    background:
      radial-gradient(900px 700px at 60% 18%, #1a2238 0%, transparent 70%),
      linear-gradient(180deg, #10162a 0%, var(--ink) 100%);
    padding: 72px 64px 90px;
  }
  .mono { font-family: "FiraCode Nerd Font", monospace; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 56px; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .logo { width: 96px; height: 96px; border-radius: 26px; background: linear-gradient(135deg, var(--amber), #ff8a3d);
    box-shadow: 0 10px 40px rgba(255,181,71,.35); display: grid; place-items: center; }
  .logo i { width: 0; height: 0; border-left: 34px solid var(--ink); border-top: 22px solid transparent; border-bottom: 22px solid transparent; margin-left: 8px; }
  h1 { font-size: 104px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
  .pill { font-size: 40px; font-weight: 700; color: var(--ink); background: var(--cyan); padding: 14px 30px; border-radius: 999px; }
  .panel { background: rgba(24,32,54,.85); border: 2px solid var(--line); border-radius: 40px; padding: 40px 44px; margin-bottom: 40px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.04), 0 20px 60px rgba(0,0,0,.35); }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 26px; }
  .label { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; }
  .meta { font-size: 40px; color: var(--dim); }
  .strip { display: flex; gap: 8px; height: 110px; }
  .strip div { border-radius: 14px; }
  .playhead { position: relative; }
  .playhead::after { content: ""; position: absolute; left: 36.5%; top: -18px; bottom: -18px; width: 8px; border-radius: 4px; background: var(--paper);
    box-shadow: 0 0 24px rgba(244,239,230,.7); }
  .wave { display: flex; align-items: center; gap: 7px; height: 150px; }
  .wave span { flex: 1; border-radius: 6px; background: var(--cyan); }
  .scene { display: flex; align-items: center; gap: 34px; background: var(--card); border: 2px solid var(--line); border-radius: 36px;
    padding: 36px 40px; margin-bottom: 26px; box-shadow: 0 14px 40px rgba(0,0,0,.35); }
  .scene.hero { border: 4px solid var(--amber); background: linear-gradient(90deg, rgba(255,181,71,.16), rgba(24,32,54,1) 70%);
    box-shadow: 0 0 0 10px rgba(255,181,71,.10), 0 24px 70px rgba(255,181,71,.18); }
  .num { font-size: 52px; font-weight: 600; color: var(--dim); width: 110px; }
  .hero .num { color: var(--amber); }
  .body { flex: 1; min-width: 0; }
  .title { font-size: 72px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.05; white-space: nowrap; }
  .chip { display: inline-block; margin-top: 16px; font-size: 40px; font-weight: 800; padding: 10px 26px; border-radius: 999px; color: var(--ink); }
  .dur { font-size: 52px; font-weight: 600; color: var(--paper); }
</style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo"><i></i></div><h1>film-studio</h1></div>
    <div class="pill">10 scenes</div>
  </header>

  <div class="panel">
    <div class="row"><div class="label">Timeline</div><div class="meta mono">00:41.6</div></div>
    <div class="strip playhead" id="strip"></div>
  </div>

  <div class="panel">
    <div class="row"><div class="label">Narration</div><div class="meta mono">-14 LUFS</div></div>
    <div class="wave" id="wave"></div>
  </div>

  <div id="list"></div>

<script>
const C = { Motionmaxxing: '#FFB547', HyperFrames: '#5EE6FF', Shotcraft: '#FF7AA8', Lemo: '#9DF27A', 'Three.js': '#B79CFF', Remotion: '#6FA8FF', Earshot: '#FFD97A' };
const S = [
  ['s1', 'Hook', 'Motionmaxxing', 3.2], ['s2', 'Problem', 'HyperFrames', 4.6], ['s3', 'Turn', 'HyperFrames', 3.9],
  ['s4', 'Real pages', 'Shotcraft', 3.8], ['s5', 'Idea beat', 'Motionmaxxing', 4.1], ['s6', 'Painted look', 'Lemo', 4.4],
  ['s7', '3D', 'Three.js', 4.8], ['s8', 'Data', 'Remotion', 4.2], ['s9', 'Sound', 'Earshot', 3.6], ['s10', 'CTA', 'Motionmaxxing', 5.0],
];
const total = S.reduce((a, s) => a + s[3], 0);
document.getElementById('strip').innerHTML = S.map(s =>
  `<div style="flex:${s[3]};background:${C[s[2]]};opacity:${s[0] === 's4' ? 1 : .55}"></div>`).join('');
// deterministic waveform
let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
document.getElementById('wave').innerHTML = Array.from({ length: 64 }, (_, i) => {
  const env = 0.35 + 0.65 * Math.abs(Math.sin(i * 0.23)) ;
  return `<span style="height:${Math.round(18 + 130 * env * (0.4 + 0.6 * r()))}px;opacity:${i > 22 && i < 32 ? 1 : .55}"></span>`;
}).join('');
document.getElementById('list').innerHTML = S.map(([id, t, k, d]) => `
  <div class="scene${id === 's4' ? ' hero' : ''}">
    <div class="num mono">${id}</div>
    <div class="body"><div class="title">${t}</div><span class="chip" style="background:${C[k]}">${k}</span></div>
    <div class="dur mono">${d.toFixed(1)}s</div>
  </div>`).join('');
</script>
</body>
</html>
