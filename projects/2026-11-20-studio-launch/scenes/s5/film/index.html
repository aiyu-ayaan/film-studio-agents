<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s5 TIMED</title>
<meta name="viewport" content="width=1440, height=2560">
<link rel="stylesheet" href="./runtime/fonts.css">
<style>
/* ACCENT = amber: the one curve the word obeys. Cyan = data (the other measured eases). */
:root { --ink:#0B0F1A; --lift:#141A2B; --paper:#F4EFE6; --amber:#FFB547; --cyan:#5EE6FF; }
* { box-sizing: border-box; }
html, body { margin:0; width:1440px; height:2560px; overflow:hidden; background:#0B0F1A; }
#main { position:absolute; left:0; top:0; width:1440px; height:2560px; overflow:hidden;
  background: radial-gradient(ellipse 1100px 1300px at 52% 34%, #141A2B 0%, #10162400 62%), #0B0F1A; }
#pool { position:absolute; left:220px; top:300px; width:1100px; height:1100px; border-radius:50%;
  background: radial-gradient(circle, rgba(255,181,71,.10) 0%, rgba(255,181,71,0) 65%); }
#cam { position:absolute; inset:0; transform-origin:1290px 660px; }
svg { position:absolute; left:0; top:0; width:1440px; height:2560px; overflow:visible; }
.grid line { stroke:#F4EFE6; stroke-opacity:.055; stroke-width:2; }
.grid line.axis { stroke-opacity:.16; stroke-width:3; }
.cy { fill:none; stroke:var(--cyan); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
#sweeps { filter: drop-shadow(0 0 10px rgba(94,230,255,.9)); }
.sw { fill:none; stroke:#C9F7FF; stroke-width:6; stroke-linecap:round; }
#amber { fill:none; stroke:var(--amber); stroke-width:14; stroke-linecap:round; stroke-linejoin:round;
  filter: drop-shadow(0 0 18px rgba(255,181,71,.55)); }
#pen { position:absolute; left:0; top:0; width:0; height:0; }
#dot { position:absolute; left:-17px; top:-17px; width:34px; height:34px; border-radius:50%; background:var(--amber);
  box-shadow: 0 0 30px 8px rgba(255,181,71,.55); }
#halo { position:absolute; left:-260px; top:-260px; width:520px; height:520px; border-radius:50%;
  background: radial-gradient(circle, rgba(255,181,71,.16) 0%, rgba(255,181,71,0) 70%); }
#wordbox { position:absolute; left:0; top:0; }
#word { position:absolute; right:26px; bottom:30px; white-space:pre; font-family:"Montserrat"; font-weight:900;
  font-size:232px; line-height:1; letter-spacing:-0.03em; color:var(--paper);
  text-shadow: 0 22px 50px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="main">
  <div id="pool"></div>
  <div id="cam">
    <svg id="plot" viewBox="0 0 1440 2560">
      <g class="grid" id="grid"></g>
      <g id="cyans"></g>
      <g id="sweeps"></g>
      <path id="amber"></path>
    </svg>
    <div id="pen"><div id="halo"></div><div id="dot"></div><div id="wordbox"><div id="word">TIMED.</div></div></div>
  </div>
</div>

<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const M = Motion.film({ fps: 30, duration: 4.17, width: 1440, height: 2560, clock: 'smooth' });
const E = Motion.ease, NS = 'http://www.w3.org/2000/svg';
// graph: time 0..1 -> x 150..1290, value 0..1 -> y 1560..660 (900 px per unit; bounceHard peaks ~1.48 -> y ~228)
const X0 = 150, XW = 1140, Y0 = 1560, YU = 900;
const P = (u, v) => [X0 + u * XW, Y0 - v * YU];
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const N = 240;
const pathD = f => { let d = ''; for (let i = 0; i <= N; i++) { const u = i / N, [x, y] = P(u, f(u)); d += (i ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2); } return d; };

// faint grid: 8 time columns, value rows every 0.25 up to 1.5
const grid = document.getElementById('grid');
for (let k = 0; k <= 8; k++) { const x = X0 + k * XW / 8; mk('line', { x1: x, y1: 210, x2: x, y2: Y0 + 40, class: k === 0 ? 'axis' : '' }, grid); }
for (let k = 0; k <= 6; k++) { const y = Y0 - k * YU / 4; mk('line', { x1: X0 - 40, y1: y, x2: X0 + XW, y2: y, class: k === 0 ? 'axis' : '' }, grid); }

// the 11 other measured eases in cyan (real curve data from runtime/motion.js), staggered 3 f, each drawn on in 12 f
const CYAN = ['crashIn', 'popOver', 'bounceHard', 'snapSettle', 'whip', 'glide', 'cruise', 'softInOut', 'gentleIn', 'accelExit', 'crashOut'];
const cy = document.getElementById('cyans'), sws = document.getElementById('sweeps');
CYAN.forEach((name, i) => {
  const d = pathD(E[name]);
  const p = mk('path', { d, class: 'cy' }, cy), L = p.getTotalLength();
  p.style.strokeDasharray = L + ' ' + L;
  const on = i * 3, start = i === 0 ? L * 0.55 : L;          // first curve is already part-drawn on frame 0 (scene starts moving)
  M.kf(p, 'strokeDashoffset', [[on, start], [on + 12, 0, 'softLand']]);
  M.kf(p, 'strokeOpacity', [[on + 14, 1], [on + 40, .42, 'softInOut']]);   // step back once drawn: the amber curve is the hero
  // glow sweep after the landing: a short bright dash runs each curve, keeps the frame alive to the cut
  const s = mk('path', { d, class: 'sw' }, sws);
  s.style.strokeDasharray = '160 ' + (L + 400);
  const a = 74 + ((i * 5) % 17) * 2;
  M.kf(s, 'strokeDashoffset', [[a, 170], [a + 34, -L, 'cruise']]);
});

// amber: softLand, the workhorse ease-out. The word's x position over time IS softLand; it rides the curve's own path.
const amber = document.getElementById('amber'), fA = E.softLand;
amber.setAttribute('d', pathD(fA));
const LA = amber.getTotalLength();
amber.style.strokeDasharray = LA + ' ' + LA;
const cum = [0]; { let prev = P(0, 0); for (let i = 1; i <= N; i++) { const q = P(i / N, fA(i / N)); cum.push(cum[i - 1] + Math.hypot(q[0] - prev[0], q[1] - prev[1])); prev = q; } }
const arcAt = u => { const k = u * N, i = Math.min(N - 1, Math.floor(k)); return cum[i] + (cum[i + 1] - cum[i]) * (k - i); };
const A0 = 24, A1 = 78;                                       // lands frame 78 = 2.6 s ("motion designer")
M.kf(amber, 'strokeDashoffset', [[A0, LA], [A1, 0, t => arcAt(fA(t)) / cum[N]]]);
M.show('#pen', A0);
M.kf('#pen', 'x', [[A0, X0], [A1, X0 + XW, fA]]);
M.kf('#pen', 'y', [[A0, Y0], [A1, Y0 - YU, t => fA(fA(t))]]);
M.mark(A1, 'snap', 'TIMED. lands');
// tiny late settle: a 9 px give on landing, then back
M.kf('#wordbox', 'y', [[A1, 0], [A1 + 3, 9, 'whip'], [A1 + 16, 0, 'softLand']]);
M.kf('#dot', 'scale', [[A1, 1], [A1 + 3, 1.35, 'whip'], [A1 + 16, 1, 'softLand']]);

// never freeze: slow camera creep toward the landing point, light pool breathes
M.drift('#cam', { prop: 'scale', from: 1, to: 1.05, start: 0, end: 126 });
M.kf('#cam', 'y', [[0, 30], [126, -20]], { ease: 'cruise' });
M.kf('#pool', 'x', [[0, -120], [126, 140]], { ease: 'cruise' });

window.__ready = Motion.loaded().then(() => { if (/selftest/.test(location.search)) Motion.selfTest(M, { samples: 24 }); });
</script>
</body>
</html>
