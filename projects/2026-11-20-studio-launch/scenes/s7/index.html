<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=2560" />
    <title>s7 Three.js helix</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/Montserrat-Black.ttf") format("truetype");
        font-weight: 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 2560px; overflow: hidden; background: #0b0f1a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0f1a; }
      #three-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #title-wrap {
        position: absolute; left: 96px; right: 96px; top: 1640px; height: 300px;
        display: flex; align-items: center; justify-content: center;
      }
      #title {
        display: block; font-family: "Montserrat", sans-serif; font-weight: 900;
        font-size: 230px; line-height: 1; letter-spacing: -0.03em; color: #f4efe6;
        white-space: nowrap; text-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      }
      #title .acc { color: #ffb547; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1440" data-height="2560" data-duration="4.17">
      <canvas id="three-layer" width="1440" height="2560"></canvas>
      <div id="title-wrap"><div id="title">Three<span class="acc">.js</span></div></div>
    </div>

    <script>
      // Title: arrives from larger than life, lands with expo.out, keeps a slow drift so it never freezes.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { scale: 2.4, y: -90, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 1.45);
      tl.fromTo("#title", { scale: 1 }, { scale: 0.95, duration: 2.32, ease: "none", immediateRender: false }, 1.85);
      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import * as THREE from "three";
      import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

      const W = 1440, H = 2560, DUR = 4.17;
      const canvas = document.getElementById("three-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      // Declared pair (3dviz knowledge.three-light-units-and-exposure): ACES filmic, exposure 1.0.
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      const scene = new THREE.Scene();
      const INK = new THREE.Color("#0b0f1a");
      scene.fog = new THREE.FogExp2(INK, 0.045);

      // RoomEnvironment at 0.15 fills micro-reflections between the soft boxes (dark-studio-product profile).
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.15;

      const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
      scene.add(camera);

      // Backdrop: ink ground lifted to #141A2B in a soft radial pool, parented to the camera.
      const backdrop = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.ShaderMaterial({
          depthWrite: false, fog: false, toneMapped: false,
          uniforms: { uT: { value: 0 } },
          vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
          fragmentShader: `
            varying vec2 vUv; uniform float uT;
            void main(){
              vec2 p = vUv - vec2(0.5, 0.56 + 0.03*uT);
              p.x *= 0.5625;
              float d = length(p * vec2(1.0, 0.8));
              float pool = smoothstep(0.42, 0.0, d);
              vec3 ink = vec3(0.0033, 0.0048, 0.0103);
              vec3 lift = vec3(0.0070, 0.0103, 0.0242);
              vec3 c = mix(ink, lift * 1.6, pool);
              gl_FragColor = vec4(c, 1.0);
            }`,
        })
      );
      const bdDist = 40;
      const bdH = 2 * bdDist * Math.tan(THREE.MathUtils.degToRad(21)) * 1.05;
      backdrop.scale.set(bdH * W / H, bdH, 1);
      backdrop.position.set(0, 0, -bdDist);
      backdrop.renderOrder = -10;
      camera.add(backdrop);

      // Light rig: three rect soft boxes (key 1.2x1.8, fill 2.0x1.2, rim strip 0.4x1.6) per dark-studio-product profile.
      RectAreaLightUniformsLib.init();
      function softbox(color, intensity, w, h, pos) {
        const l = new THREE.RectAreaLight(color, intensity, w, h);
        l.position.set(...pos);
        l.lookAt(0, 0, 0);
        scene.add(l);
        return l;
      }
      softbox(0xfff1dc, 9, 1.2, 1.8, [-3.2, 2.0, 4.0]);   // key, warm
      softbox(0x9fc4ff, 1.6, 2.0, 1.2, [3.5, -2.5, 3.0]); // fill, low and cool
      softbox(0xffc070, 14, 0.4, 1.6, [1.2, 1.5, -4.0]);  // rim strip behind, amber
      const keySpot = new THREE.SpotLight(0xffe2b8, 40, 30, 0.5, 0.8, 2);
      keySpot.position.set(0, 9, 4);
      keySpot.target.position.set(0, 0, 0);
      scene.add(keySpot, keySpot.target);

      // Deterministic RNG.
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

      // Film frame: dark glossy card (receives the soft boxes) + emissive face shader (amber edge, cyan inner glow, still).
      const FW = 1.0, FH = 0.7, R = 0.07;
      function roundedShape(w, h, r) {
        const s = new THREE.Shape();
        const x = -w / 2, y = -h / 2;
        s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
        s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
        s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
        return s;
      }
      const cardGeo = new THREE.ShapeGeometry(roundedShape(FW, FH, R), 6);
      const cardMat = new THREE.MeshPhysicalMaterial({
        color: 0x141a2b, metalness: 0.65, roughness: 0.28, clearcoat: 0.6, clearcoatRoughness: 0.2,
        side: THREE.DoubleSide,
      });
      const faceGeo = new THREE.PlaneGeometry(FW * 1.12, FH * 1.16);
      const faceVS = `
        varying vec2 vUv; varying float vDist;
        void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.0); vDist = -mv.z; gl_Position = projectionMatrix * mv; }`;
      const faceFS = `
        varying vec2 vUv; varying float vDist;
        uniform float uKind; uniform float uSeed; uniform float uT; uniform float uGain;
        float sdRound(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q,0.0)) + min(max(q.x,q.y),0.0) - r; }
        void main(){
          vec2 sz = vec2(${(FW * 1.12).toFixed(3)}, ${(FH * 1.16).toFixed(3)});
          vec2 p = (vUv - 0.5) * sz;
          float d = sdRound(p, vec2(${(FW / 2).toFixed(3)}, ${(FH / 2).toFixed(3)}), ${R.toFixed(3)});
          vec3 amber = vec3(1.0, 0.46, 0.065);
          vec3 cyan = vec3(0.11, 0.79, 1.0);
          // Edge line + soft outer halo.
          float edge = smoothstep(0.012, 0.0, abs(d + 0.006));
          float halo = exp(-max(d, 0.0) * 38.0) * step(0.0, d) * 0.25;
          vec3 col = amber * (edge * 4.2 + halo);
          float a = 0.0;
          // Faint cyan inner glow hugging the edge.
          float inner = exp(-max(-d, 0.0) * 22.0) * step(d, 0.0);
          col += cyan * inner * 0.22;
          // Sprocket holes on top and bottom bands.
          float band = step(${(FH / 2 - 0.085).toFixed(3)}, abs(p.y)) * step(d, -0.02);
          vec2 sp = vec2(mod(p.x + 0.04, 0.08) - 0.04, abs(p.y) - ${(FH / 2 - 0.045).toFixed(3)});
          float hole = smoothstep(0.004, 0.0, sdRound(sp, vec2(0.016, 0.013), 0.005));
          col += amber * band * hole * 0.9;
          // Tiny abstract still in the picture area.
          vec2 img = vec2(${(FW / 2 - 0.05).toFixed(3)}, ${(FH / 2 - 0.1).toFixed(3)});
          float inPic = step(sdRound(p, img, 0.02), 0.0);
          vec2 q = p / img;
          vec3 still = vec3(0.0);
          if (uKind > 0.5 && uKind < 1.5) {          // horizon + sun
            vec3 sky = mix(vec3(0.9,0.35,0.08), vec3(0.08,0.12,0.35), q.y*0.5+0.5);
            float sun = smoothstep(0.32, 0.28, length(q - vec2(0.3*sin(uSeed*6.0), 0.05)));
            still = mix(sky, vec3(1.0,0.8,0.45), sun) * (q.y > -0.25 ? 1.0 : 0.25);
          } else if (uKind > 1.5 && uKind < 2.5) {   // concentric rings
            float r = length(q * vec2(1.4, 1.0));
            still = mix(vec3(0.05,0.35,0.5), vec3(1.0,0.6,0.2), 0.5+0.5*sin(r*14.0 - uT*3.0 + uSeed*10.0));
          } else if (uKind > 2.5) {                  // figure silhouette against a window
            float fig = step(length((q - vec2(-0.1 + 0.2*uSeed, -0.2)) * vec2(2.6, 1.1)), 0.5);
            still = mix(vec3(0.85,0.75,0.6), vec3(0.03), fig) * (0.6 + 0.4*q.y);
          }
          col += still * inPic * 0.42;
          a = clamp(max(max(col.r, col.g), col.b), 0.0, 1.0);
          float fogF = exp(-pow(0.045 * vDist, 2.0));
          col *= fogF * uGain;
          gl_FragColor = vec4(col, 1.0);
        }`;

      const helix = new THREE.Group();
      scene.add(helix);
      const N = 20, RAD = 1.55, DA = 0.86, DY = 0.36;
      const faces = [];
      for (let i = 0; i < N; i++) {
        const a = i * DA;
        const y = (i - (N - 1) / 2) * DY;
        const g = new THREE.Group();
        g.position.set(RAD * Math.sin(a), y, RAD * Math.cos(a));
        g.rotation.order = "YXZ";
        g.rotation.y = a;
        g.rotation.x = -0.1;
        g.rotation.z = (rnd() - 0.5) * 0.08;
        const card = new THREE.Mesh(cardGeo, cardMat);
        card.position.z = -0.004;
        const kind = rnd() < 0.6 ? 1 + Math.floor(rnd() * 3) : 0;
        const mat = new THREE.ShaderMaterial({
          uniforms: { uKind: { value: kind }, uSeed: { value: rnd() }, uT: { value: 0 }, uGain: { value: 1 } },
          vertexShader: faceVS, fragmentShader: faceFS,
          transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
        });
        const face = new THREE.Mesh(faceGeo, mat);
        g.add(card, face);
        helix.add(g);
        faces.push(mat);
      }

      // Seeded dust drifting in the light pool for depth.
      const DUST = 420;
      const dustBase = new Float32Array(DUST * 4);
      for (let i = 0; i < DUST; i++) {
        dustBase[i * 4] = (rnd() - 0.5) * 9;
        dustBase[i * 4 + 1] = (rnd() - 0.5) * 12;
        dustBase[i * 4 + 2] = (rnd() - 0.5) * 9;
        dustBase[i * 4 + 3] = rnd();
      }
      const dustPos = new Float32Array(DUST * 3);
      const dustGeo = new THREE.BufferGeometry();
      dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
      const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
        color: 0xffd9a0, size: 0.022, transparent: true, opacity: 0.55,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      scene.add(dust);

      // Post: bloom on the HDR amber edges only, then output, then ~3% grain.
      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1);
      composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.85, 0.55, 1.0));
      composer.addPass(new OutputPass());
      const grain = new ShaderPass({
        uniforms: { tDiffuse: { value: null }, uFrame: { value: 0 } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
        fragmentShader: `
          uniform sampler2D tDiffuse; uniform float uFrame; varying vec2 vUv;
          float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uFrame*1.618) * 43758.5453); }
          void main(){
            vec4 c = texture2D(tDiffuse, vUv);
            vec2 v = vUv - 0.5; v.x *= 0.7;
            c.rgb *= 1.0 - smoothstep(0.35, 0.85, length(v)) * 0.55;
            c.rgb += (h(floor(vUv * vec2(1440.0, 2560.0))) - 0.5) * 0.06;
            gl_FragColor = c;
          }`,
      });
      composer.addPass(grain);

      const ease = (u) => 0.35 * u + 0.65 * (1 - (1 - u) * (1 - u)); // never reaches zero velocity
      const lerp = (a, b, k) => a + (b - a) * k;
      const camTarget = new THREE.Vector3();

      function renderAt(time) {
        const t = Math.max(0, Math.min(DUR, time));
        const u = ease(t / DUR);
        helix.rotation.y = 0.4 + t * 0.62;
        helix.position.y = -t * 0.08;
        // Push in and tilt up through the helix.
        camera.position.set(lerp(0.6, -0.15, u), lerp(-3.1, 0.6, u), lerp(9.2, 3.0, u));
        camTarget.set(0, lerp(-1.6, 3.6, u), 0);
        camera.lookAt(camTarget);
        camera.rotateZ(lerp(-0.035, 0.03, u));
        backdrop.material.uniforms.uT.value = u;
        const flick = 1 + 0.04 * Math.sin(t * 23.0) * Math.sin(t * 7.3);
        for (let i = 0; i < faces.length; i++) {
          faces[i].uniforms.uT.value = t;
          faces[i].uniforms.uGain.value = flick * (0.85 + 0.15 * Math.sin(t * 2.4 + i * 0.9));
        }
        for (let i = 0; i < DUST; i++) {
          const ph = dustBase[i * 4 + 3];
          dustPos[i * 3] = dustBase[i * 4] + Math.sin(t * 0.7 + ph * 20) * 0.12;
          dustPos[i * 3 + 1] = dustBase[i * 4 + 1] + t * (0.12 + ph * 0.2);
          dustPos[i * 3 + 2] = dustBase[i * 4 + 2];
        }
        dustGeo.attributes.position.needsUpdate = true;
        grain.uniforms.uFrame.value = Math.round(t * 30);
        composer.render();
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
