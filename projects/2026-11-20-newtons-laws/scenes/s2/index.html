<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, height=2560" />
  <script src="./gsap.min.js"></script>
  <style>
    :root {
      --ground: #0B101B;
      --panel: #131B2E;
      --ink: #F4F7FB;
      --muted: #94A3B8;
      --cyan: #38BDF8;
      --amber: #F59E0B;
      --emerald: #34D399;
      --coral: #FB7185;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1440px; height: 2560px; overflow: hidden;
      background: var(--ground); font-family: "DejaVu Sans", sans-serif; color: var(--ink);
    }
    #root {
      position: relative; width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #16223A 0%, #0D1322 55%, #0B101B 100%);
    }
    .grid {
      position: absolute; inset: -10%;
      background-image:
        linear-gradient(rgba(148,163,184,0.06) 2px, transparent 2px),
        linear-gradient(90deg, rgba(148,163,184,0.06) 2px, transparent 2px);
      background-size: 72px 72px;
    }
    .grain {
      position: absolute; inset: 0; opacity: 0.04; pointer-events: none;
      background-image: radial-gradient(rgba(244,247,251,0.75) 1px, transparent 0);
      background-size: 6px 6px;
    }
    #header {
      position: absolute; top: 220px; left: 110px; width: 1120px;
      display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    }
    #title {
      font-size: 78px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink);
    }
    #subtitle {
      font-size: 44px; font-weight: 600; color: var(--emerald);
    }
    #eq-card {
      position: absolute; top: 1120px; left: 110px; width: 1120px;
      background: rgba(19, 27, 46, 0.92);
      border: 3px solid rgba(148, 163, 184, 0.25);
      border-radius: 30px;
      padding: 34px 46px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .eq-title {
      font-size: 38px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em;
    }
    .eq-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 28px; border-radius: 18px; background: rgba(11, 16, 27, 0.72);
      font-size: 52px; font-weight: 700;
    }
    .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
    .eq-note { font-size: 38px; font-weight: 600; color: var(--muted); }
    #state-pill {
      position: absolute; top: 1650px; left: 110px; width: 1120px;
      padding: 26px 36px; border-radius: 24px; text-align: center;
      background: rgba(52, 211, 153, 0.12); border: 3px solid rgba(52, 211, 153, 0.45);
      font-size: 44px; font-weight: 700; color: var(--emerald);
    }
    #unbal-pill {
      position: absolute; top: 1650px; left: 110px; width: 1120px;
      padding: 26px 36px; border-radius: 24px; text-align: center;
      background: rgba(245, 158, 11, 0.16); border: 3px solid rgba(245, 158, 11, 0.65);
      font-size: 44px; font-weight: 700; color: var(--amber);
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="23.0" data-width="1440" data-height="2560">
    <div id="stage" class="clip" data-start="0" data-duration="23.0" data-track-index="0">
      <div class="grid" id="grid"></div>
      <div id="header">
        <div id="title">First Law: Inertia</div>
        <div id="subtitle">Free Body Diagram (FBD)</div>
      </div>

      <svg id="fbd-svg" viewBox="0 0 1440 2560" width="1440" height="2560" style="position:absolute;inset:0;pointer-events:none;">
        <defs>
          <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
          </linearGradient>
          <linearGradient id="blockGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#0369A1"/>
          </linearGradient>
        </defs>

        <!-- Table -->
        <rect x="120" y="905" width="1100" height="32" rx="8" fill="url(#tableGrad)" stroke="#475569" stroke-width="3"/>
        <line x1="180" y1="937" x2="180" y2="1065" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
        <line x1="1160" y1="937" x2="1160" y2="1065" stroke="#334155" stroke-width="18" stroke-linecap="round"/>

        <!-- Moving / Resting Block Group -->
        <g id="block-group">
          <!-- Velocity trail -->
          <g id="vel-lines" opacity="0">
            <line x1="360" y1="740" x2="480" y2="740" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
            <line x1="310" y1="790" x2="460" y2="790" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
            <line x1="380" y1="840" x2="490" y2="840" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
          </g>

          <!-- FBD Dashed Isolation Box -->
          <rect id="fbd-box" x="430" y="425" width="460" height="645" rx="28" fill="rgba(56,189,248,0.04)" stroke="#38BDF8" stroke-width="4" stroke-dasharray="16 12"/>
          <text id="fbd-tag" x="660" y="480" text-anchor="middle" fill="#38BDF8" font-size="38" font-weight="700">ISOLATED BODY</text>

          <!-- Block -->
          <rect x="540" y="670" width="240" height="232" rx="18" fill="url(#blockGrad)" stroke="#BAE6FD" stroke-width="4"/>
          <text x="588" y="742" text-anchor="middle" fill="#0B101B" font-size="56" font-weight="800" font-family="Georgia, serif" font-style="italic">m</text>

          <!-- Center of Mass Dot -->
          <circle id="com-dot" cx="660" cy="786" r="14" fill="#F4F7FB" stroke="#0B101B" stroke-width="4"/>

          <!-- Downward Gravity Vector: mg -->
          <g id="vec-mg">
            <line x1="660" y1="800" x2="660" y2="1010" stroke="#FB7185" stroke-width="12" stroke-linecap="round"/>
            <polygon points="660,1040 636,995 684,995" fill="#FB7185"/>
            <line x1="644" y1="950" x2="676" y2="950" stroke="#F4F7FB" stroke-width="5" stroke-linecap="round"/>
            <rect x="705" y="948" width="295" height="68" rx="14" fill="rgba(11,16,27,0.92)" stroke="#FB7185" stroke-width="3"/>
            <text x="852" y="995" text-anchor="middle" fill="#FB7185" font-size="40" font-weight="700">mg (Gravity)</text>
          </g>

          <!-- Upward Normal Vector: F_N -->
          <g id="vec-fn">
            <line x1="660" y1="772" x2="660" y2="562" stroke="#34D399" stroke-width="12" stroke-linecap="round"/>
            <polygon points="660,532 636,577 684,577" fill="#34D399"/>
            <line x1="644" y1="622" x2="676" y2="622" stroke="#F4F7FB" stroke-width="5" stroke-linecap="round"/>
            <rect x="705" y="566" width="320" height="68" rx="14" fill="rgba(11,16,27,0.92)" stroke="#34D399" stroke-width="3"/>
            <text x="865" y="613" text-anchor="middle" fill="#34D399" font-size="40" font-weight="700">F_N (Normal)</text>
          </g>

          <!-- Unbalanced Applied Force Arrow -->
          <g id="vec-fapp">
            <line x1="210" y1="786" x2="505" y2="786" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
            <polygon points="538,786 490,760 490,812" fill="#F59E0B"/>
            <rect x="200" y="692" width="265" height="66" rx="14" fill="rgba(11,16,27,0.94)" stroke="#F59E0B" stroke-width="3"/>
            <text x="332" y="738" text-anchor="middle" fill="#F59E0B" font-size="40" font-weight="700">F_app (Push)</text>
          </g>
        </g>
      </svg>

      <!-- Balanced Equations Card -->
      <div id="eq-card">
        <div class="eq-title">BALANCED FORCES DERIVATION</div>
        <div class="eq-row" id="eq1">
          <span class="math" style="color: var(--emerald);">F_N = m·g</span>
          <span class="eq-note">Equal &amp; opposite</span>
        </div>
        <div class="eq-row" id="eq2">
          <span class="math" style="color: var(--cyan);">ΣF = F_N − m·g = 0</span>
          <span class="eq-note">Net force is zero</span>
        </div>
        <div class="eq-row" id="eq3">
          <span class="math" style="color: var(--ink);">a = ΣF / m = 0</span>
          <span class="eq-note" style="color: var(--emerald);">Zero acceleration</span>
        </div>
      </div>

      <div id="state-pill">At rest (v = 0) or steady velocity (v = const)</div>
      <div id="unbal-pill">Unbalanced force F_app &gt; 0 ⇒ Object accelerates!</div>
    </div>
    <div class="grain"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo('#grid', { y: 0 }, { y: -140, duration: 23.0, ease: 'none' }, 0);
    tl.fromTo('#title', { y: -50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0);
    tl.fromTo('#subtitle', { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.25);

    tl.set('#fbd-box', { opacity: 0, scale: 0.92, transformOrigin: '660px 786px' }, 0);
    tl.set('#fbd-tag', { opacity: 0 }, 0);
    tl.set('#com-dot', { opacity: 0, scale: 0.2, transformOrigin: '660px 786px' }, 0);
    tl.set('#vec-mg', { opacity: 0, y: -40 }, 0);
    tl.set('#vec-fn', { opacity: 0, y: 40 }, 0);
    tl.set('#vec-fapp', { opacity: 0, x: -90 }, 0);
    tl.set(['#eq-card', '#eq1', '#eq2', '#eq3', '#state-pill', '#unbal-pill'], { opacity: 0, y: 40 }, 0);

    tl.fromTo('#block-group', { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0);

    tl.to(['#fbd-box', '#fbd-tag'], { opacity: 1, scale: 1, duration: 0.45, ease: 'power3.out' }, 2.2);
    tl.to('#com-dot', { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.7)' }, 2.4);
    tl.to('#vec-mg', { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 4.4);
    tl.to('#vec-fn', { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 8.4);

    tl.to('#eq-card', { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 10.0);
    tl.to('#eq1', { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 10.3);
    tl.to('#eq2', { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 12.1);
    tl.to('#eq3', { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 13.9);

    tl.to('#state-pill', { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 15.5);
    tl.to('#vel-lines', { opacity: 0.85, duration: 0.3 }, 17.6);
    tl.to('#block-group', { x: 80, duration: 2.2, ease: 'none' }, 17.8);

    tl.to('#state-pill', { opacity: 0, y: -20, duration: 0.25 }, 20.3);
    tl.to('#unbal-pill', { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 20.45);
    tl.to('#vec-fapp', { opacity: 1, x: 0, duration: 0.35, ease: 'power3.out' }, 20.5);
    tl.to('#block-group', { x: 350, duration: 2.1, ease: 'power2.in' }, 20.9);

    window.__timelines = { main: tl };
  </script>
</body>
</html>
