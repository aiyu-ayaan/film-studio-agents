<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, height=2560" />
  <script src="./gsap.min.js"></script>
  <style>
    :root {
      --ground: #0B101B;
      --panel: #131B2E;
      --ink: #F4F7FB;
      --muted: #94A3B8;
      --cyan: #38BDF8;
      --amber: #F59E0B;
      --emerald: #34D399;
      --coral: #FB7185;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1440px; height: 2560px; overflow: hidden;
      background: var(--ground); font-family: "DejaVu Sans", sans-serif; color: var(--ink);
    }
    #root {
      position: relative; width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #16223A 0%, #0D1322 55%, #0B101B 100%);
    }
    .grid {
      position: absolute; inset: -10%;
      background-image:
        linear-gradient(rgba(148,163,184,0.06) 2px, transparent 2px),
        linear-gradient(90deg, rgba(148,163,184,0.06) 2px, transparent 2px);
      background-size: 72px 72px;
    }
    .grain {
      position: absolute; inset: 0; opacity: 0.04; pointer-events: none;
      background-image: radial-gradient(rgba(244,247,251,0.75) 1px, transparent 0);
      background-size: 6px 6px;
    }
    #header {
      position: absolute; top: 270px; left: 110px; width: 1120px;
      display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;
    }
    #title {
      font-size: 74px; font-weight: 800; letter-spacing: -0.02em;
    }
    #eq-badge {
      padding: 14px 40px; border-radius: 20px;
      background: rgba(56, 189, 248, 0.14); border: 3px solid var(--cyan);
      font-family: Georgia, "Times New Roman", serif; font-style: italic;
      font-size: 58px; font-weight: 800; color: var(--cyan);
    }
    #summary-pill {
      position: absolute; top: 1490px; left: 110px; width: 1120px;
      padding: 32px 44px; border-radius: 26px;
      background: rgba(19, 27, 46, 0.94); border: 3px solid var(--amber);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 46px; font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8.6" data-width="1440" data-height="2560">
    <div id="stage" class="clip" data-start="0" data-duration="8.6" data-track-index="0">
      <div class="grid" id="grid"></div>
      <div id="header">
        <div id="title">Same Force, Different Mass</div>
        <div id="eq-badge">a = F / m</div>
      </div>

      <svg viewBox="0 0 1440 2560" width="1440" height="2560" style="position:absolute;inset:0;pointer-events:none;">
        <!-- Track 1: Light Box (1 kg) -->
        <rect x="110" y="510" width="1120" height="390" rx="28" fill="rgba(19,27,46,0.78)" stroke="rgba(148,163,184,0.22)" stroke-width="3"/>
        <text x="155" y="575" fill="#38BDF8" font-size="40" font-weight="800">LIGHT MASS (1 kg)</text>
        <line x1="150" y1="845" x2="1190" y2="845" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

        <g id="light-unit">
          <line x1="170" y1="765" x2="345" y2="765" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
          <polygon points="378,765 332,740 332,790" fill="#F59E0B"/>
          <text x="260" y="728" text-anchor="middle" fill="#F59E0B" font-size="38" font-weight="800">F = 12 N</text>

          <rect x="388" y="690" width="150" height="150" rx="16" fill="#38BDF8" stroke="#BAE6FD" stroke-width="4"/>
          <text x="463" y="780" text-anchor="middle" fill="#0B101B" font-size="46" font-weight="800">1 kg</text>

          <g id="acc-fast">
            <line x1="388" y1="635" x2="720" y2="635" stroke="#34D399" stroke-width="10" stroke-linecap="round"/>
            <polygon points="752,635 710,613 710,657" fill="#34D399"/>
            <text x="570" y="608" text-anchor="middle" fill="#34D399" font-size="38" font-weight="800">a = 12 m/s²</text>
          </g>
        </g>

        <!-- Track 2: Heavy Box (4 kg) -->
        <rect x="110" y="960" width="1120" height="440" rx="28" fill="rgba(19,27,46,0.78)" stroke="rgba(148,163,184,0.22)" stroke-width="3"/>
        <text x="155" y="1025" fill="#FB7185" font-size="40" font-weight="800">HEAVY MASS (4 kg)</text>
        <line x1="150" y1="1345" x2="1190" y2="1345" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

        <g id="heavy-unit">
          <line x1="170" y1="1245" x2="345" y2="1245" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
          <polygon points="378,1245 332,1220 332,1270" fill="#F59E0B"/>
          <text x="260" y="1208" text-anchor="middle" fill="#F59E0B" font-size="38" font-weight="800">F = 12 N</text>

          <rect x="388" y="1125" width="240" height="215" rx="20" fill="#FB7185" stroke="#FECDD3" stroke-width="4"/>
          <text x="508" y="1248" text-anchor="middle" fill="#0B101B" font-size="52" font-weight="800">4 kg</text>

          <g id="acc-slow">
            <line x1="388" y1="1080" x2="475" y2="1080" stroke="#34D399" stroke-width="10" stroke-linecap="round"/>
            <polygon points="507,1080 465,1058 465,1102" fill="#34D399"/>
            <text x="645" y="1090" fill="#34D399" font-size="38" font-weight="800">a = 3 m/s²</text>
          </g>
        </g>
      </svg>

      <div id="summary-pill">
        <span style="color: var(--coral);">More Mass (4×)</span>
        <span style="color: var(--ink);">⇒</span>
        <span style="color: var(--emerald);">Less Accel. (¼×)</span>
      </div>
    </div>
    <div class="grain"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo('#grid', { y: 0 }, { y: -80, duration: 8.6, ease: 'none' }, 0);
    tl.fromTo('#title', { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0);
    tl.fromTo('#eq-badge', { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(1.4)' }, 0.2);

    tl.set(['#acc-fast', '#acc-slow', '#summary-pill'], { opacity: 0 }, 0);

    tl.to(['#acc-fast', '#acc-slow'], { opacity: 1, duration: 0.35, ease: 'power2.out' }, 1.6);
    tl.fromTo('#light-unit', { x: 0 }, { x: 430, duration: 5.5, ease: 'power2.in' }, 1.9);
    tl.fromTo('#heavy-unit', { x: 0 }, { x: 108, duration: 5.5, ease: 'power2.in' }, 1.9);

    tl.fromTo('#summary-pill', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 5.6);

    window.__timelines = { main: tl };
  </script>
</body>
</html>
