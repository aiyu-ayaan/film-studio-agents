<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, height=2560" />
  <script src="./gsap.min.js"></script>
  <style>
    :root {
      --ground: #0B101B;
      --panel: #131B2E;
      --ink: #F4F7FB;
      --muted: #94A3B8;
      --cyan: #38BDF8;
      --amber: #F59E0B;
      --emerald: #34D399;
      --coral: #FB7185;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1440px; height: 2560px; overflow: hidden;
      background: var(--ground); font-family: "DejaVu Sans", sans-serif; color: var(--ink);
    }
    #root {
      position: relative; width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #16223A 0%, #0D1322 55%, #0B101B 100%);
    }
    .grid {
      position: absolute; inset: -10%;
      background-image:
        linear-gradient(rgba(148,163,184,0.06) 2px, transparent 2px),
        linear-gradient(90deg, rgba(148,163,184,0.06) 2px, transparent 2px);
      background-size: 72px 72px;
    }
    .grain {
      position: absolute; inset: 0; opacity: 0.04; pointer-events: none;
      background-image: radial-gradient(rgba(244,247,251,0.75) 1px, transparent 0);
      background-size: 6px 6px;
    }
    #header {
      position: absolute; top: 270px; left: 110px; width: 1120px;
      display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    }
    #title {
      font-size: 70px; font-weight: 800; letter-spacing: -0.02em;
    }
    #subtitle {
      font-size: 42px; font-weight: 600; color: var(--coral);
    }
    #eq-card {
      position: absolute; top: 1450px; left: 110px; width: 1120px;
      padding: 24px 40px; border-radius: 24px;
      background: rgba(19, 27, 46, 0.94); border: 3px solid rgba(148, 163, 184, 0.35);
      display: flex; align-items: center; justify-content: space-between;
    }
    #eq-main {
      font-family: Georgia, "Times New Roman", serif; font-style: italic;
      font-size: 68px; font-weight: 800;
    }
    #eq-sub { font-size: 38px; font-weight: 600; color: var(--muted); text-align: right; }
    #rule-pill {
      position: absolute; top: 1630px; left: 110px; width: 1120px;
      padding: 26px 40px; border-radius: 24px; text-align: center;
      background: rgba(251, 113, 133, 0.16); border: 4px solid var(--coral);
      font-size: 42px; font-weight: 800; color: var(--ink);
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="18.2" data-width="1440" data-height="2560">
    <div id="stage" class="clip" data-start="0" data-duration="18.2" data-track-index="0">
      <div class="grid" id="grid"></div>
      <div id="header">
        <div id="title">Third Law: Action &amp; Reaction</div>
        <div id="subtitle">Paired Free Body Diagrams</div>
      </div>

      <svg viewBox="0 0 1440 2560" width="1440" height="2560" style="position:absolute;inset:0;pointer-events:none;">
        <!-- Top Ice Track -->
        <line x1="110" y1="720" x2="1230" y2="720" stroke="#475569" stroke-width="8" stroke-linecap="round"/>

        <!-- Contact Spark -->
        <g id="spark">
          <circle cx="670" cy="570" r="56" fill="rgba(251,113,133,0.28)" stroke="#FB7185" stroke-width="5"/>
          <line x1="670" y1="480" x2="670" y2="660" stroke="#F4F7FB" stroke-width="5" stroke-dasharray="10 10"/>
        </g>

        <!-- Skater / Cart A -->
        <g id="skater-a">
          <rect x="470" y="470" width="180" height="190" rx="22" fill="#38BDF8" stroke="#BAE6FD" stroke-width="4"/>
          <text x="560" y="585" text-anchor="middle" fill="#0B101B" font-size="68" font-weight="800">A</text>
          <circle cx="510" cy="686" r="24" fill="#1E293B" stroke="#94A3B8" stroke-width="5"/>
          <circle cx="610" cy="686" r="24" fill="#1E293B" stroke="#94A3B8" stroke-width="5"/>
          <g id="push-a">
            <line x1="455" y1="565" x2="320" y2="565" stroke="#FB7185" stroke-width="14" stroke-linecap="round"/>
            <polygon points="285,565 333,540 333,590" fill="#FB7185"/>
            <text x="375" y="525" text-anchor="middle" fill="#FB7185" font-size="38" font-weight="800">F_AB</text>
          </g>
        </g>

        <!-- Skater / Cart B -->
        <g id="skater-b">
          <rect x="690" y="470" width="180" height="190" rx="22" fill="#F59E0B" stroke="#FDE68A" stroke-width="4"/>
          <text x="780" y="585" text-anchor="middle" fill="#0B101B" font-size="68" font-weight="800">B</text>
          <circle cx="730" cy="686" r="24" fill="#1E293B" stroke="#94A3B8" stroke-width="5"/>
          <circle cx="830" cy="686" r="24" fill="#1E293B" stroke="#94A3B8" stroke-width="5"/>
          <g id="push-b">
            <line x1="885" y1="565" x2="1020" y2="565" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
            <polygon points="1055,565 1007,540 1007,590" fill="#F59E0B"/>
            <text x="965" y="525" text-anchor="middle" fill="#F59E0B" font-size="38" font-weight="800">F_BA</text>
          </g>
        </g>

        <!-- Side-by-side Paired FBDs -->
        <!-- Left Panel: FBD of Body A -->
        <g id="fbd-a">
          <rect x="110" y="790" width="540" height="610" rx="28" fill="rgba(19,27,46,0.9)" stroke="#38BDF8" stroke-width="4" stroke-dasharray="16 12"/>
          <text x="380" y="852" text-anchor="middle" fill="#38BDF8" font-size="40" font-weight="800">FBD OF BODY A</text>

          <rect x="330" y="1035" width="100" height="100" rx="16" fill="#38BDF8" stroke="#BAE6FD" stroke-width="4"/>
          <text x="354" y="1072" text-anchor="middle" fill="#0B101B" font-size="36" font-weight="800">A</text>
          <circle cx="380" cy="1085" r="10" fill="#F4F7FB"/>

          <line x1="380" y1="1035" x2="380" y2="925" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>
          <polygon points="380,900 364,932 396,932" fill="#34D399"/>
          <text x="415" y="942" fill="#34D399" font-size="38" font-weight="700">F_N</text>

          <line x1="380" y1="1135" x2="380" y2="1245" stroke="#FB7185" stroke-width="8" stroke-linecap="round"/>
          <polygon points="380,1270 364,1238 396,1238" fill="#FB7185"/>
          <text x="415" y="1256" fill="#FB7185" font-size="38" font-weight="700">m_A·g</text>

          <line x1="330" y1="1085" x2="185" y2="1085" stroke="#FB7185" stroke-width="14" stroke-linecap="round"/>
          <polygon points="150,1085 198,1059 198,1111" fill="#FB7185"/>
          <text x="235" y="1044" text-anchor="middle" fill="#FB7185" font-size="40" font-weight="800">F_AB</text>
          <text x="380" y="1355" text-anchor="middle" fill="#94A3B8" font-size="38" font-weight="600">Force ON A by B</text>
        </g>

        <!-- Right Panel: FBD of Body B -->
        <g id="fbd-b">
          <rect x="690" y="790" width="540" height="610" rx="28" fill="rgba(19,27,46,0.9)" stroke="#F59E0B" stroke-width="4" stroke-dasharray="16 12"/>
          <text x="960" y="852" text-anchor="middle" fill="#F59E0B" font-size="40" font-weight="800">FBD OF BODY B</text>

          <rect x="910" y="1035" width="100" height="100" rx="16" fill="#F59E0B" stroke="#FDE68A" stroke-width="4"/>
          <text x="934" y="1072" text-anchor="middle" fill="#0B101B" font-size="36" font-weight="800">B</text>
          <circle cx="960" cy="1085" r="10" fill="#F4F7FB"/>

          <line x1="960" y1="1035" x2="960" y2="925" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>
          <polygon points="960,900 944,932 976,932" fill="#34D399"/>
          <text x="995" y="942" fill="#34D399" font-size="38" font-weight="700">F_N</text>

          <line x1="960" y1="1135" x2="960" y2="1245" stroke="#FB7185" stroke-width="8" stroke-linecap="round"/>
          <polygon points="960,1270 944,1238 976,1238" fill="#FB7185"/>
          <text x="995" y="1256" fill="#FB7185" font-size="38" font-weight="700">m_B·g</text>

          <line x1="1010" y1="1085" x2="1155" y2="1085" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
          <polygon points="1190,1085 1142,1059 1142,1111" fill="#F59E0B"/>
          <text x="1105" y="1044" text-anchor="middle" fill="#F59E0B" font-size="40" font-weight="800">F_BA</text>
          <text x="960" y="1355" text-anchor="middle" fill="#94A3B8" font-size="38" font-weight="600">Force ON B by A</text>
        </g>
      </svg>

      <div id="eq-card">
        <div id="eq-main">
          <span style="color: var(--coral);">F_AB</span>
          <span style="color: var(--ink);"> = −</span>
          <span style="color: var(--amber);">F_BA</span>
        </div>
        <div id="eq-sub">Equal size, opposite sign</div>
      </div>

      <div id="rule-pill">Act on 2 DIFFERENT bodies ⇒ NEVER cancel!</div>
    </div>
    <div class="grain"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo('#grid', { y: 0 }, { y: -120, duration: 18.2, ease: 'none' }, 0);
    tl.fromTo('#title', { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0);
    tl.fromTo('#subtitle', { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.2);

    tl.set(['#spark', '#push-a', '#push-b', '#fbd-a', '#fbd-b', '#eq-card', '#rule-pill'], { opacity: 0 }, 0);
    tl.fromTo('#skater-a', { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0.1);
    tl.fromTo('#skater-b', { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0.1);

    tl.fromTo('#spark', { scale: 0.3, opacity: 0, transformOrigin: '670px 570px' }, { scale: 1.2, opacity: 1, duration: 0.35, ease: 'power2.out' }, 3.4);
    tl.to('#spark', { scale: 1.6, opacity: 0, duration: 0.45 }, 3.85);
    tl.to(['#push-a', '#push-b'], { opacity: 1, duration: 0.25 }, 3.5);
    tl.to('#skater-a', { x: -165, duration: 4.5, ease: 'power2.out' }, 3.6);
    tl.to('#skater-b', { x: 165, duration: 4.5, ease: 'power2.out' }, 3.6);

    tl.fromTo('#fbd-a', { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 6.1);
    tl.fromTo('#fbd-b', { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 6.4);

    tl.fromTo('#eq-card', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 10.0);
    tl.fromTo('#rule-pill', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'back.out(1.3)' }, 13.6);

    window.__timelines = { main: tl };
  </script>
</body>
</html>
