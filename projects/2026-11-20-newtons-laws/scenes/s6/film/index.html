<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s6 - Recap</title>
<meta name="viewport" content="width=1440, height=2560">
<link rel="stylesheet" href="./runtime/fonts.css">
<style>
:root {
  --ground: #0B101B;
  --panel: #131B2E;
  --ink: #F4F7FB;
  --muted: #94A3B8;
  --cyan: #38BDF8;
  --amber: #F59E0B;
  --emerald: #34D399;
  --coral: #FB7185;
  --font: "Inter", "DejaVu Sans", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1440px; height: 2560px; overflow: hidden; background: #000; }
#main {
  position: absolute; left: 0; top: 0; width: 1440px; height: 2560px;
  overflow: hidden; background: var(--ground); color: var(--ink);
  font-family: var(--font); font-weight: 700;
}
.scene { position: absolute; inset: 0; }
.cam { position: absolute; inset: 0; }
.bg-glow {
  position: absolute; inset: -15%;
  background: radial-gradient(circle at 50% 42%, rgba(56,189,248,0.16) 0%, rgba(52,211,153,0.06) 40%, rgba(11,16,27,0) 72%);
}
.grid {
  position: absolute; inset: -10%;
  background-image:
    linear-gradient(rgba(148,163,184,0.06) 2px, transparent 2px),
    linear-gradient(90deg, rgba(148,163,184,0.06) 2px, transparent 2px);
  background-size: 72px 72px;
}
.grain {
  position: absolute; inset: 0; opacity: 0.04; pointer-events: none;
  background-image: radial-gradient(rgba(244,247,251,0.75) 1px, transparent 0);
  background-size: 6px 6px;
}
#title {
  position: absolute; left: 100px; top: 240px; width: 1240px; text-align: center;
  font-size: 86px; line-height: 100px; letter-spacing: -0.02em; color: var(--ink);
}
.law-card {
  position: absolute; left: 130px; width: 1180px; height: 290px;
  background: rgba(19, 27, 46, 0.92);
  border: 3px solid rgba(148, 163, 184, 0.25);
  border-radius: 28px;
  padding: 36px 54px;
  display: flex; align-items: center; justify-content: space-between;
}
.law-left { display: flex; flex-direction: column; gap: 12px; }
.law-name { font-size: 52px; font-weight: 800; letter-spacing: -0.01em; }
.law-desc { font-size: 40px; font-weight: 500; color: var(--muted); }
.law-eq {
  font-size: 66px; font-weight: 800; font-family: Georgia, "Times New Roman", serif;
  font-style: italic; padding: 18px 34px; border-radius: 18px;
  background: rgba(11, 16, 27, 0.85);
}
#closing {
  position: absolute; left: 120px; top: 1580px; width: 1200px; text-align: center;
  font-size: 96px; line-height: 112px; letter-spacing: -0.03em; color: var(--cyan);
}
#motes { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="main">
  <section id="s6" class="scene">
    <div id="cam6" class="cam">
      <div class="bg-glow" id="glow"></div>
      <div class="grid" id="grid"></div>
      <svg id="motes" viewBox="0 0 1440 2560"></svg>
      <div id="title">Newton's Three Laws</div>

      <div id="card1" class="law-card" style="top: 430px; border-color: rgba(52,211,153,0.45);">
        <div class="law-left">
          <div class="law-name" style="color: var(--emerald);">First Law · Inertia</div>
          <div class="law-desc">Balanced forces mean zero change</div>
        </div>
        <div class="law-eq" style="color: var(--emerald);">ΣF = 0</div>
      </div>

      <div id="card2" class="law-card" style="top: 780px; border-color: rgba(245,158,11,0.45);">
        <div class="law-left">
          <div class="law-name" style="color: var(--amber);">Second Law · Motion</div>
          <div class="law-desc">Net force drives acceleration</div>
        </div>
        <div class="law-eq" style="color: var(--amber);">F = m·a</div>
      </div>

      <div id="card3" class="law-card" style="top: 1130px; border-color: rgba(251,113,133,0.45);">
        <div class="law-left">
          <div class="law-name" style="color: var(--coral);">Third Law · Pairs</div>
          <div class="law-desc">Equal &amp; opposite on two bodies</div>
        </div>
        <div class="law-eq" style="color: var(--coral);">F₁₂ = −F₂₁</div>
      </div>

      <div id="closing">Physics, made simple.</div>
    </div>
    <div class="grain"></div>
  </section>
</div>
<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const M = Motion.film({ fps: 30, duration: 11.5, width: 1440, height: 2560, clock: 'smooth' });

(function buildMotes() {
  const svg = document.getElementById('motes');
  let s = 3341;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = 0; i < 24; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', (100 + rnd() * 1240).toFixed(1));
    c.setAttribute('cy', (140 + rnd() * 1720).toFixed(1));
    c.setAttribute('r', (2.5 + rnd() * 4).toFixed(1));
    c.setAttribute('fill', i % 2 === 0 ? '#38BDF8' : '#34D399');
    c.setAttribute('opacity', (0.15 + rnd() * 0.3).toFixed(2));
    c.classList.add('mote');
    svg.appendChild(c);
  }
})();

// Continuous slow camera drift (keeps every frame alive; end hold <= 1.2s)
M.kf('#cam6', 'scale', [[0, 1.0], [315, 1.05, 'linear'], [345, 1.055, 'linear']]);
M.kf('#grid', 'y', [[0, 0], [345, -75, 'linear']]);

M.words('#title', { at: 0, mech: 'rise', dist: 65, gaps: [4, 4], smear: true });
M.enter('#card1', { at: 4, frames: 14, ease: 'softLand', from: { x: -120, opacity: 0 }, smear: { axis: 'x', px: 20, frames: 3 } });
M.enter('#card2', { at: 78, frames: 14, ease: 'softLand', from: { x: 120, opacity: 0 }, smear: { axis: 'x', px: 20, frames: 3 } });
M.enter('#card3', { at: 180, frames: 14, ease: 'softLand', from: { x: -120, opacity: 0 }, smear: { axis: 'x', px: 20, frames: 3 } });
M.words('#closing', { at: 262, mech: 'rise', dist: 75, gaps: [5, 5], smear: true, accent: { color: '#F59E0B', frames: 20, word: -1 } });

document.querySelectorAll('.mote').forEach((el, idx) => {
  const dy = -120 - (idx % 4) * 35;
  const dx = ((idx % 2 === 0 ? 1 : -1) * (15 + (idx % 3) * 12));
  M.tl.fromTo(el, { y: 0, x: 0 }, { y: dy, x: dx, duration: 11.5, ease: 'none' }, 0);
});
</script>
</body>
</html>
