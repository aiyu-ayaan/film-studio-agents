<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#EDE6D6;overflow:hidden}canvas{display:block}</style>
<canvas id=c></canvas>
<script type=module>
import {mulberry,clamp,seg,ss,eio,vnoise,lerp} from '/core/lib.js';
const W=innerWidth,H=innerHeight,cv=document.getElementById('c');cv.width=W;cv.height=H;
const g=cv.getContext('2d');
window.DUR=215/30;
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const INK=(a,t=0)=>`rgba(${14+t},${18+t},${32+t},${a})`;
// ridge polygon
function ridge(x,seed,base,amp,fq){let r=mulberry(seed),o=r()*100;return W*0+base-amp*(vnoise(o+x*fq)*.7+vnoise(o+x*fq*2.7)*.3)}
function layer(draw){const c=mk(),x=c.getContext('2d');draw(x);return c}
const rnd=mulberry(7);
// sky: indigo dusk wash to warm paper glow at horizon
const sky=layer(x=>{
 let gr=x.createLinearGradient(0,0,0,H*.62);gr.addColorStop(0,'#2a3350');gr.addColorStop(.45,'#7C8DA8');gr.addColorStop(.85,'#d9d2c4');gr.addColorStop(1,'#EDE6D6');
 x.fillStyle=gr;x.fillRect(0,0,W,H);
 gr=x.createLinearGradient(0,H*.62,0,H);gr.addColorStop(0,'#EDE6D6');gr.addColorStop(1,'#cfc8b8');x.fillStyle=gr;x.fillRect(0,H*.62,W,H);
 // ember sun glow, soft
 x.filter='blur(60px)';x.fillStyle='rgba(242,163,58,.35)';x.beginPath();x.arc(W*.68,H*.5,160,0,7);x.fill();x.filter='none';
 // mottled paper cloud
 x.globalCompositeOperation='multiply';
 for(let i=0;i<60;i++){x.filter='blur(90px)';x.fillStyle=`rgba(120,110,95,${.05+rnd()*.05})`;x.beginPath();x.ellipse(rnd()*W,rnd()*H,120+rnd()*260,60+rnd()*160,0,0,7);x.fill()}
 x.filter='none';x.globalCompositeOperation='source-over';
});
function mount(seed,base,amp,fq,col,mist){return layer(x=>{
 x.filter='blur(3px)';
 x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=8)x.lineTo(i,ridge(i,seed,base,amp,fq*.004));x.lineTo(W,H);x.closePath();
 const gr=x.createLinearGradient(0,base-amp,0,base+260);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(237,230,214,0)');x.fillStyle=gr;x.fill();
 // loaded dark edge
 x.strokeStyle=INK(.35);x.lineWidth=5;x.beginPath();for(let i=0;i<=W;i+=8)x[i?'lineTo':'moveTo'](i,ridge(i,seed,base,amp,fq*.004));x.stroke();x.filter='none';
 // cun texture dry strokes
 const r=mulberry(seed+1);x.strokeStyle=INK(.14);x.lineCap='round';
 for(let k=0;k<160;k++){const px=r()*W,py=ridge(px,seed,base,amp,fq*.004)+20+r()*amp*.7;x.lineWidth=1+r()*3;x.beginPath();x.moveTo(px,py);x.lineTo(px+(r()-.5)*40,py+30+r()*60);x.stroke()}
})}
const m1=mount(11,H*.50,250,1,'rgba(124,141,168,.5)'),m2=mount(23,H*.55,200,1.4,'rgba(60,72,100,.55)'),m3=mount(37,H*.60,150,2,'rgba(20,26,46,.72)');
// river body: pale with dry streaks drawn per frame; static far bank + near bank
const bankFar=layer(x=>{x.filter='blur(4px)';x.fillStyle=INK(.5);x.beginPath();x.moveTo(0,H*.645);for(let i=0;i<=W;i+=10)x.lineTo(i,H*.645-14*vnoise(i*.01+3));x.lineTo(W,H*.665);x.lineTo(0,H*.665);x.fill();x.filter='none';
 x.strokeStyle=INK(.55);x.lineCap='round';const r=mulberry(5);for(let k=0;k<90;k++){const px=r()*W,py=H*.64+r()*8;x.lineWidth=2;x.beginPath();x.moveTo(px,py);x.lineTo(px+(r()-.5)*10,py-30-r()*60);x.stroke()}});
const bankNear=layer(x=>{
 x.filter='blur(5px)';const gr=x.createLinearGradient(0,H*.72,0,H);gr.addColorStop(0,INK(.9));gr.addColorStop(1,INK(.97));x.fillStyle=gr;
 x.beginPath();x.moveTo(0,H*.76);for(let i=0;i<=W;i+=10){const y=H*.76+(i/W)*H*.04-40*vnoise(i*.004+9)+((i>W*.55)?(i-W*.55)*.32:0);x.lineTo(i,y)}x.lineTo(W,H);x.lineTo(0,H);x.fill();x.filter='none';
 // reeds
 const r=mulberry(9);x.strokeStyle=INK(.9);x.lineCap='round';
 for(let k=0;k<70;k++){const px=r()*W,by=H*.77+r()*40+(px>W*.55?(px-W*.55)*.3:0),h=120+r()*230,lean=(r()-.5)*90;x.lineWidth=2+r()*4;x.beginPath();x.moveTo(px,by);x.quadraticCurveTo(px+lean*.2,by-h*.6,px+lean,by-h);x.stroke()}
});
// ground path line where monks walk (dry strokes)
// figure drawing
function monk(x,px,py,s,ph,robe){
 x.save();x.translate(px,py);x.scale(s,s);
 const bob=Math.sin(ph*Math.PI*2)*3;
 x.filter='blur(1.5px)';
 // robe mass
 let gr=x.createLinearGradient(0,-150,0,0);gr.addColorStop(0,INK(.8*robe));gr.addColorStop(1,INK(.55*robe));x.fillStyle=gr;
 x.beginPath();x.moveTo(-26,-150+bob);x.quadraticCurveTo(-48,-70,-40,0);x.quadraticCurveTo(0,10,40,0);x.quadraticCurveTo(48,-70,26,-150+bob);x.closePath();x.fill();
 // loaded edge
 x.strokeStyle=INK(.95);x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(-26,-150+bob);x.quadraticCurveTo(-48,-70,-40,0);x.stroke();
 // head
 x.fillStyle='rgba(237,230,214,.92)';x.beginPath();x.arc(0,-172+bob,19,0,7);x.fill();x.strokeStyle=INK(.9);x.lineWidth=4;x.stroke();
 // legs hint
 const sw=Math.sin(ph*Math.PI*2)*14;x.lineWidth=7;x.beginPath();x.moveTo(-12,0);x.lineTo(-12+sw,24);x.moveTo(12,0);x.lineTo(12-sw,24);x.stroke();
 // staff
 x.lineWidth=3.5;x.beginPath();x.moveTo(44,-125+bob);x.lineTo(50+sw*.3,24);x.stroke();
 x.restore();x.filter='none';
}
function woman(x,px,py,s,t){
 x.save();x.translate(px,py);x.scale(s,s);x.filter='blur(1.5px)';const sway=Math.sin(t*1.7)*2;
 let gr=x.createLinearGradient(0,-140,0,0);gr.addColorStop(0,INK(.5));gr.addColorStop(1,INK(.35));x.fillStyle=gr;
 x.beginPath();x.moveTo(-18+sway,-135);x.quadraticCurveTo(-52,-60,-44,0);x.quadraticCurveTo(0,12,44,0);x.quadraticCurveTo(50,-70,20+sway,-135);x.closePath();x.fill();
 x.strokeStyle=INK(.9);x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(-18+sway,-135);x.quadraticCurveTo(-52,-60,-44,0);x.stroke();
 x.fillStyle='rgba(237,230,214,.92)';x.beginPath();x.arc(sway+2,-155,17,0,7);x.fill();x.lineWidth=4;x.stroke();
 // hair bun + hands clasped
 x.fillStyle=INK(.95);x.beginPath();x.arc(sway+4,-176,9,0,7);x.fill();
 x.lineWidth=5;x.beginPath();x.moveTo(-12,-95);x.quadraticCurveTo(0,-80,14,-95);x.stroke();
 // ember lantern in hand
 x.filter='blur(14px)';x.fillStyle='rgba(242,163,58,.55)';x.beginPath();x.arc(30,-60,26+Math.sin(t*5)*3,0,7);x.fill();x.filter='none';
 x.fillStyle='#F2A33A';x.beginPath();x.arc(30,-60,7,0,7);x.fill();
 x.restore();x.filter='none';
}
// reveal mask: horizontal brush strokes growing
function maskFor(seed,p,rows,y0,y1){const c=mk(),x=c.getContext('2d');const r=mulberry(seed);x.lineCap='round';x.strokeStyle='#000';
 for(let i=0;i<rows;i++){const y=lerp(y0,y1,i/(rows-1))+(r()-.5)*40,dir=r()<.5,delay=r()*.35,pp=ss((p-delay)/(1-.35)),len=pp*(W*1.3);
  x.lineWidth=(y1-y0)/rows*2.2;const a=dir?-W*.15:W*1.15,b=a+(dir?len:-len);x.filter='blur(14px)';x.beginPath();x.moveTo(a,y);x.lineTo(b,y+(r()-.5)*30);x.stroke()}
 x.filter='none';return c}
const tmp=mk(),tx=tmp.getContext('2d');
function reveal(src,seed,p,y0,y1,dst){ // paint src through brush mask
 if(p>=1){dst.drawImage(src,0,0);return}
 if(p<=0)return;tx.globalCompositeOperation='copy';tx.drawImage(src,0,0);tx.globalCompositeOperation='destination-in';tx.drawImage(maskFor(seed,p,14,y0,y1),0,0);tx.globalCompositeOperation='source-over';dst.drawImage(tmp,0,0)}
const scene=mk(),sx=scene.getContext('2d');
function river(x,t){x.save();x.strokeStyle='rgba(60,72,100,.22)';x.lineCap='round';const r=mulberry(77);
 for(let k=0;k<70;k++){const py=H*.665+r()*(H*.1)+0,ph=r()*6.28,w=60+r()*260,px=((r()*W+t*(10+r()*25)*(py/H))%(W+300))-150;x.lineWidth=1.5+(py-H*.665)/H*18*r();x.globalAlpha=.5+.5*Math.sin(t*1.2+ph);x.beginPath();x.moveTo(px,py);x.lineTo(px+w,py);x.stroke()}
 x.restore()}
window.render=t=>{
 // reveal progress per layer: already partly painted at t=0
 const P=(a,b)=>ss(seg(t,a,b));
 sx.clearRect(0,0,W,H);
 sx.drawImage(sky,0,0);
 reveal(m1,1,.35+.65*P(0,1.6),H*.3,H*.65,sx);
 reveal(m2,2,.2+.8*P(0,2.2),H*.35,H*.68,sx);
 reveal(m3,3,.1+.9*P(0.1,2.8),H*.4,H*.7,sx);
 sx.save();sx.globalAlpha=P(0.3,2.6)*.8+.2;sx.fillStyle='rgba(237,230,214,.55)';sx.filter='blur(40px)';sx.fillRect(0,H*.6,W,H*.05);sx.filter='none';sx.restore();
 sx.drawImage(bankFar,0,0);
 // river
 sx.save();sx.beginPath();sx.rect(0,H*.665,W,H*.12);sx.clip();river(sx,t);sx.restore();
 reveal(bankNear,4,.55+.45*P(0.2,2.0),H*.6,H,sx);
 // figures walk along bank, slowly left->right, then pause toward woman
 const wk=eio(seg(t,0,7.17))*.0+seg(t,0,7.17);
 const bY=x=>H*.775+(x>W*.55?(x-W*.55)*.3:0)+ -20*vnoise(x*.004+9)*0; 
 const mx1=lerp(W*.14,W*.40,wk),mx2=mx1-120;
 const sc=2.0, fa=P(0.2,1.2);
 sx.save();sx.globalAlpha=fa;
 monk(sx,mx2,bY(mx2)+30,sc*.93,wk*5.5+.4,.85);
 monk(sx,mx1,bY(mx1)+36,sc,wk*5.5,1);
 woman(sx,W*.80,bY(W*.80)+30,sc*.95,t);
 sx.restore();
 // water reflection of woman's lantern
 sx.save();sx.filter='blur(10px)';sx.globalAlpha=.4*fa;sx.fillStyle='#F2A33A';sx.beginPath();sx.ellipse(W*.80+40,H*.72,10,70+Math.sin(t*3)*8,0,0,7);sx.fill();sx.restore();
 // birds
 sx.strokeStyle=INK(.7);sx.lineWidth=4;for(let i=0;i<3;i++){const bx=((W*.9-t*50*(1+i*.2)+i*160)%W+W)%W,by=H*.2+i*55+Math.sin(t*2+i)*8;sx.beginPath();sx.moveTo(bx-18,by-6);sx.quadraticCurveTo(bx,by+4,bx+18,by-6);sx.stroke()}
 // camera: slow push-in toward figures, small drift
 const z=1+.16*(t/window.DUR),cx=W*.55,cy=H*.62;
 g.setTransform(1,0,0,1,0,0);g.fillStyle='#EDE6D6';g.fillRect(0,0,W,H);
 g.setTransform(z,0,0,z,cx-cx*z-8*t,cy-cy*z);g.drawImage(scene,0,0);g.setTransform(1,0,0,1,0,0);
 // vignette
 const v=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);v.addColorStop(0,'rgba(14,18,32,0)');v.addColorStop(1,'rgba(14,18,32,.35)');g.fillStyle=v;g.fillRect(0,0,W,H);
};
window.READY=true;
</script>
