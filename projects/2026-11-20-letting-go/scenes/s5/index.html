<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1440, height=2560"/>
<title>s5 notes</title>
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1440px;height:2560px;overflow:hidden;background:#0E1220}
#root{position:relative;width:1440px;height:2560px;overflow:hidden;background:#0E1220}
.bg{position:absolute;inset:-200px;background:radial-gradient(900px 1300px at 50% 40%,#1c2540 0%,#0E1220 70%)}
.vig{position:absolute;inset:0;background:radial-gradient(1200px 1800px at 50% 45%,transparent 55%,rgba(5,7,14,.7) 100%);z-index:9}
.far{position:absolute;border-radius:50%;filter:blur(60px);background:#7C8DA8;opacity:.18}
.stage{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 45%}
#cam{position:absolute;left:0;top:0;width:1440px;height:2560px;transform-style:preserve-3d}
#card{position:absolute;left:120px;top:250px;width:1200px;height:1700px;transform-style:preserve-3d}
#card img{position:absolute;left:0;top:0;width:1200px;height:1700px}
#shadow{position:absolute;left:120px;top:250px;width:1200px;height:1700px;border-radius:56px;background:#000;filter:blur(50px);opacity:.55;transform:translateZ(-160px) translate(40px,60px)}
.ember{position:absolute;border-radius:50%;background:#F2A33A;filter:blur(8px)}
</style></head><body>
<div id="root" data-composition-id="s5" data-start="0" data-duration="11.4" data-width="1440" data-height="2560" data-fps="30" data-layout-allow-overflow>
 <div class="clip" id="shot" data-start="0" data-duration="11.4" data-track-index="0" data-layout-allow-overflow style="position:absolute;inset:0">
  <div class="bg" id="bg"></div>
  <div class="far" id="f1" style="left:80px;top:300px;width:700px;height:700px"></div>
  <div class="far" id="f2" style="left:800px;top:1500px;width:800px;height:800px;background:#F2A33A;opacity:.07"></div>
  <div class="stage"><div id="cam">
    <div id="shadow"></div>
    <div id="card">
      <img src="public/n0.png"/>
      <img id="i1" src="public/n1.png"/><img id="i2" src="public/n2.png"/>
      <img id="i3" src="public/n3.png"/><img id="i4" src="public/n4.png"/>
    </div>
    <div class="ember" id="e1" style="left:150px;top:2100px;width:60px;height:60px;opacity:.5;transform:translateZ(240px)"></div>
    <div class="ember" id="e2" style="left:1180px;top:700px;width:90px;height:90px;opacity:.3;filter:blur(18px);transform:translateZ(300px)"></div>
    <div class="ember" id="e3" style="left:1250px;top:1700px;width:40px;height:40px;opacity:.5;transform:translateZ(200px)"></div>
  </div></div>
  <div class="vig"></div>
 </div>
</div>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
gsap.set("#cam",{transformOrigin:"720px 1100px"});
gsap.set(["#i1","#i2","#i3","#i4"],{opacity:0,x:-60});
// 2.5D camera drift across the whole shot
tl.fromTo("#cam",{rotationY:-14,rotationX:7,scale:1.0,x:40,y:60},{rotationY:9,rotationX:-3,scale:1.1,x:-30,y:-120,duration:11.4,ease:"sine.inOut"},0);
tl.fromTo("#bg",{x:-30,y:0},{x:40,y:-60,duration:11.4,ease:"none"},0);
tl.fromTo("#f1",{x:0,y:0},{x:120,y:200,duration:11.4,ease:"none"},0);
tl.fromTo("#f2",{x:0,y:0},{x:-160,y:-220,duration:11.4,ease:"none"},0);
tl.fromTo("#e1,#e3",{y:0},{y:-500,duration:11.4,ease:"none"},0);
tl.fromTo("#e2",{y:0},{y:-300,duration:11.4,ease:"none"},0);
// rows land with the spoken phrase (scene time = vo time - 35.08)
[["#i1",3.64],["#i2",5.56],["#i3",7.16],["#i4",8.84]].forEach(([s,t])=>{
  tl.to(s,{opacity:1,x:0,duration:0.5,ease:"power3.out"},t);
});
// small punch on the last item
tl.to("#cam",{scale:"+=0.04",duration:0.6,ease:"power2.out"},8.84);
window.__timelines["s5"]=tl;
</script></body></html>
