<!doctype html>
<html><head><meta charset="utf-8"><title>s4</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
html,body{margin:0;background:#0E1220;width:1440px;height:2560px;overflow:hidden}
#root{position:relative;width:1440px;height:2560px}
canvas{position:absolute;left:0;top:0;width:1440px;height:2560px;display:block}
#grain{mix-blend-mode:normal;opacity:1}
</style></head>
<body>
<div id="root" data-no-timeline data-composition-id="s4" data-start="0" data-duration="5" data-width="1440" data-height="2560">
<canvas id="three-layer" width="1440" height="2560"></canvas>
<canvas id="grain" width="360" height="640"></canvas>
</div>
<script type="module">
import * as THREE from "three";
const W=1440,H=2560,DUR=5;
const canvas=document.getElementById("three-layer");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0E1220);
scene.fog=new THREE.Fog(0x0E1220,9,22);
const camera=new THREE.PerspectiveCamera(32,W/H,0.1,60);

// deterministic hash noise
const h=(n)=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const ember=new THREE.Color(0xF2A33A);

// stone: displaced icosahedron
const sg=new THREE.IcosahedronGeometry(1,4);
const p=sg.attributes.position;
for(let i=0;i<p.count;i++){
  const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
  const d=1+0.13*Math.sin(x*3.1+1.3)*Math.cos(y*2.7)+0.08*Math.sin(z*4.3+x*2.1)+0.04*Math.sin(y*7+z*5);
  p.setXYZ(i,x*d*1.05,y*d*0.88,z*d);
}
sg.computeVertexNormals();
const stoneMat=new THREE.MeshStandardMaterial({color:0x2a2f40,roughness:0.75,metalness:0.15,emissive:0xd9822b,emissiveIntensity:0.3});
const stone=new THREE.Mesh(sg,stoneMat);
// inner glowing core hint: slightly larger additive shell
const shellMat=new THREE.MeshBasicMaterial({color:ember,transparent:true,opacity:0.15,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false});
const shell=new THREE.Mesh(new THREE.SphereGeometry(1.35,48,32),shellMat);
const stoneGrp=new THREE.Group();stoneGrp.add(stone,shell);scene.add(stoneGrp);
const glow=new THREE.PointLight(0xF2A33A,20,12,1.6);stoneGrp.add(glow);

// hands: palm shell + fingers, mirrored
const handMat=new THREE.MeshStandardMaterial({color:0x7C8DA8,roughness:0.7,metalness:0.0,emissive:0x1b2236,emissiveIntensity:1});
function makeHand(side){
  const g=new THREE.Group();
  const palm=new THREE.Mesh(new THREE.SphereGeometry(1.25,40,24,0,Math.PI*2,Math.PI*0.52,Math.PI*0.36),handMat);
  palm.material=handMat.clone();palm.material.side=THREE.DoubleSide;
  palm.scale.set(1,0.8,1.0);
  g.add(palm);
  const fingers=[];
  for(let i=0;i<4;i++){
    const f=new THREE.Group();
    const a=(-0.42+i*0.28);
    const cap=new THREE.Mesh(new THREE.CapsuleGeometry(0.13,0.75,6,12),handMat);
    cap.position.y=0.45;f.add(cap);
    f.position.set(0.95,-0.45,a*1.4);
    f.userData.a=a;
    g.add(f);fingers.push(f);
  }
  const thumb=new THREE.Group();
  const tc=new THREE.Mesh(new THREE.CapsuleGeometry(0.15,0.6,6,12),handMat);tc.position.y=0.35;thumb.add(tc);
  thumb.position.set(0.2,-0.5,1.05);g.add(thumb);
  const wrist=new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1.6,8,16),handMat);
  wrist.rotation.z=Math.PI/2;wrist.position.set(-1.7,-0.55,0);g.add(wrist);
  g.userData={fingers,thumb};
  g.scale.x=side; // mirror
  return g;
}
const L=makeHand(-1),R=makeHand(1);
const hands=new THREE.Group();hands.add(L,R);scene.add(hands);

// ground slab + faint reflection disc
const ground=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.6,0.3,64),new THREE.MeshStandardMaterial({color:0x151a2c,roughness:0.55,metalness:0.2}));
ground.position.y=-2.05;scene.add(ground);
const halo=new THREE.Mesh(new THREE.CircleGeometry(1.4,64),new THREE.MeshBasicMaterial({color:ember,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
halo.rotation.x=-Math.PI/2;halo.position.y=-1.89;scene.add(halo);

// lights
scene.add(new THREE.HemisphereLight(0x7C8DA8,0x0E1220,0.9));
const key=new THREE.DirectionalLight(0xEDE6D6,0.9);key.position.set(-4,6,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x7C8DA8,1.2);rim.position.set(4,3,-5);scene.add(rim);

// dust motes
const N=70,mg=new THREE.BufferGeometry(),mp=new Float32Array(N*3);
for(let i=0;i<N;i++){mp[i*3]=(h(i)-0.5)*9;mp[i*3+1]=(h(i+99)-0.5)*14;mp[i*3+2]=(h(i+7)-0.5)*6-1}
mg.setAttribute("position",new THREE.BufferAttribute(mp,3));
const motes=new THREE.Points(mg,new THREE.PointsMaterial({color:0xEDE6D6,size:0.035,transparent:true,opacity:0.35,depthWrite:false}));
scene.add(motes);

const ease=(x)=>x*x*(3-2*x);
const cl=(x)=>Math.min(1,Math.max(0,x));
const gctx=document.getElementById("grain").getContext("2d");
const gimg=gctx.createImageData(360,640);

function renderAt(t){
  // phases: 0-2.1 heavier & sagging; 2.1-3.7 lowered; 3.7-5 rest
  const sag=ease(cl(t/2.1));
  const low=ease(cl((t-2.1)/1.6));
  const rest=ease(cl((t-3.7)/1.3));
  const tremble=(1-low)*sag*0.035*Math.sin(t*38)+ (1-low)*sag*0.02*Math.sin(t*23+1);
  const yTop=0.8, ySag=0.3, yRest=-0.95;
  let y=yTop+(ySag-yTop)*sag; y=y+(yRest-ySag)*low*0 ; // sag first
  y=y+( (yRest)-(yTop+(ySag-yTop)*sag) )*low;
  y+=tremble;
  stoneGrp.position.set(0,y,0);
  stoneGrp.rotation.y=0.4+t*0.05; stoneGrp.rotation.z=0.03*Math.sin(t*1.3);
  const sc=1+0.04*sag*(1-low);
  stoneGrp.scale.setScalar(sc*0.8);
  // glow: ramps up with weight, softens at rest
  const gi=0.06+0.4*sag*(1-low*0.6)-0.05*rest;
  stoneMat.emissiveIntensity=gi; shellMat.opacity=0.05+0.12*sag*(1-low*0.55);
  glow.intensity=8+30*sag*(1-low*0.5);glow.position.set(0.3,0.9,2.6);
  halo.material.opacity=0.55*low*(1-rest*0.35);
  // hands: follow stone, spread at release
  const rel=ease(cl((t-2.9)/1.5)); // open outward
  const hy=y-0.95+0.0;
  hands.position.set(0,y-0.2,0);hands.scale.setScalar(0.55);
  const sagTilt=0.18*sag*(1-rel);
  for(const [hd,s] of [[L,-1],[R,1]]){
    hd.position.x=s*(1.15+ rel*1.1 + 0.08*Math.sin(t*38)*(1-low)*sag);
    hd.position.y=-0.15*sag*(1-low)-0.45*rel;
    hd.rotation.z=-s*(sagTilt*-1)*1 + s*rel*0.0;
    hd.rotation.z=0; // hd.scale.x mirrors; use local rot below
    hd.rotation.x=0;
    hd.children.forEach(c=>{});
    hd.userData.fingers.forEach((f,i)=>{
      f.rotation.z=-(0.9 - 0.9*rel*0.8 + 0.25*sag*(1-rel)) ; // curl closed, droop with strain, open on release
      f.rotation.x=(f.userData.a)*0.4;
    });
    hd.userData.thumb.rotation.z=-(0.7-0.6*rel);
    hd.rotation.y=0;
    hd.rotation.z=s*(-0.0)+(-0.12*sag*(1-rel))*-1*0; 
  }
  // hands droop: wrists sag more than fingers
  const droop=0.22*sag*(1-rel);
  L.rotation.z=droop; R.rotation.z=-droop; // sign verified visually
  // camera: slow push + lower tilt
  const cy=0.2-0.5*low, cz=10.5-0.8*ease(cl(t/DUR));
  camera.position.set(Math.sin(t*0.4)*0.1,cy+0.5,cz);
  camera.lookAt(0,-0.3-0.3*low,0);
  motes.position.y=-(t*0.12)%1; motes.rotation.y=t*0.02;
  renderer.render(scene,camera);
  // grain 0.03, seeded per frame
  const fr=Math.round(t*30), d=gimg.data;
  for(let i=0;i<360*640;i++){const v=h(i*0.37+fr*91.7)>0.5?255:0;d[i*4]=v;d[i*4+1]=v;d[i*4+2]=v;d[i*4+3]=Math.round(255*0.03*(0.5+h(i+fr)));}
  gctx.putImageData(gimg,0,0);
}
window.addEventListener("hf-seek",(e)=>renderAt(e.detail.time));
window.__hf=window.__hf||{};
renderAt(window.__hfThreeTime||0);
</script>
</body></html>
