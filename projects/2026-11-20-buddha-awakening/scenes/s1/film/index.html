<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s1 - Hook</title>
<meta name="viewport" content="width=1440, height=2560">
<link rel="stylesheet" href="./runtime/fonts.css">
<style>
:root {
  --ground: #0F0D0B;
  --ink: #F2E8D5;
  --ink-soft: #B8A88E;
  --accent: #D4A34A;
  --font: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1440px; height: 2560px; overflow: hidden; background: #000; }
#main {
  position: absolute; left: 0; top: 0; width: 1440px; height: 2560px;
  overflow: hidden; background: var(--ground); color: var(--ink);
  font-family: var(--font); font-weight: 700;
}
.scene { position: absolute; inset: 0; }
.cam { position: absolute; inset: 0; }
.bg-glow {
  position: absolute; inset: -15%;
  background: radial-gradient(circle at 50% 42%, rgba(212,163,74,0.16) 0%, rgba(158,58,46,0.06) 38%, rgba(15,13,11,0) 70%);
}
.grain {
  position: absolute; inset: 0; opacity: 0.045; pointer-events: none;
  background-image: radial-gradient(rgba(242,232,213,0.7) 1px, transparent 0);
  background-size: 6px 6px;
}
.word-line {
  position: absolute; left: 100px; width: 1240px; text-align: center;
  font-size: 132px; line-height: 150px; letter-spacing: -0.02em; white-space: pre;
}
#rule {
  position: absolute; left: 520px; top: 1090px; width: 400px; height: 5px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  transform-origin: center center;
}
#dust-layer { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="main">
  <section id="s1" class="scene">
    <div id="cam1" class="cam">
      <div class="bg-glow" id="glow"></div>
      <svg id="dust-layer" viewBox="0 0 1440 2560"></svg>
      <div id="h1" class="word-line" style="top: 860px;">EVERY LUXURY</div>
      <div id="rule"></div>
      <div id="h2" class="word-line" style="top: 1160px; color: var(--accent);">STILL EMPTY.</div>
    </div>
    <div class="grain"></div>
  </section>
</div>
<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const M = Motion.film({ fps: 30, duration: 5.5, width: 1440, height: 2560, clock: 'smooth' });
const ACCENT = '#D4A34A';

// Seeded dust particles (deterministic, no Math.random)
(function buildDust() {
  const svg = document.getElementById('dust-layer');
  let s = 4219;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = 0; i < 36; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', (80 + rnd() * 1280).toFixed(1));
    c.setAttribute('cy', (120 + rnd() * 1900).toFixed(1));
    c.setAttribute('r', (2 + rnd() * 4.5).toFixed(1));
    c.setAttribute('fill', i % 3 === 0 ? '#D4A34A' : '#F2E8D5');
    c.setAttribute('opacity', (0.15 + rnd() * 0.45).toFixed(2));
    c.classList.add('mote');
    svg.appendChild(c);
  }
})();

// Continuous slow camera push + glow breath
M.kf('#cam1', 'scale', [[0, 1.0], [164, 1.08, 'linear']]);
M.kf('#glow', 'scale', [[0, 0.95], [82, 1.08, 'sineInOut'], [164, 0.98, 'sineInOut']]);

// Line 1 lands right away (mid-motion on frame 0)
M.words('#h1', { at: 0, mech: 'rise', dist: 90, gaps: [5], smear: true });
M.kf('#rule', 'scaleX', [[0, 0.05], [14, 1, 'snapSettle'], [140, 1.15, 'gentleIn']]);
M.words('#h2', { at: 48, mech: 'rise', dist: 90, gaps: [6], smear: true, accent: { color: '#F2E8D5', frames: 18 } });

// Dust drift via pure timeline
document.querySelectorAll('.mote').forEach((el, idx) => {
  const dy = -120 - (idx % 5) * 35;
  const dx = ((idx % 2 === 0 ? 1 : -1) * (20 + (idx % 4) * 12));
  M.tl.fromTo(el, { y: 0, x: 0 }, { y: dy, x: dx, duration: 5.5, ease: 'none' }, 0);
});
</script>
</body>
</html>
