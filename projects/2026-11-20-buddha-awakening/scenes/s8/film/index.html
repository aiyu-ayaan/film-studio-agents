<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s8 - Payoff</title>
<meta name="viewport" content="width=1440, height=2560">
<link rel="stylesheet" href="./runtime/fonts.css">
<style>
:root {
  --ground: #0F0D0B;
  --ink: #F2E8D5;
  --accent: #D4A34A;
  --font: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1440px; height: 2560px; overflow: hidden; background: #000; }
#main {
  position: absolute; left: 0; top: 0; width: 1440px; height: 2560px;
  overflow: hidden; background: var(--ground); color: var(--ink);
  font-family: var(--font); font-weight: 700;
}
.scene { position: absolute; inset: 0; }
.cam { position: absolute; inset: 0; }
.bg-glow {
  position: absolute; inset: -10%;
  background: radial-gradient(circle at 50% 42%, rgba(212,163,74,0.22) 0%, rgba(212,163,74,0.04) 45%, rgba(15,13,11,0) 72%);
}
.grain {
  position: absolute; inset: 0; opacity: 0.045; pointer-events: none;
  background-image: radial-gradient(rgba(242,232,213,0.7) 1px, transparent 0);
  background-size: 6px 6px;
}
.word-line {
  position: absolute; left: 100px; width: 1240px; text-align: center;
  font-size: 136px; line-height: 155px; letter-spacing: -0.02em; white-space: pre;
}
#lotus-wrap {
  position: absolute; left: 520px; top: 520px; width: 400px; height: 280px;
}
</style>
</head>
<body>
<div id="main">
  <section id="s8" class="scene">
    <div id="cam8" class="cam">
      <div class="bg-glow" id="glow"></div>
      <svg id="embers" viewBox="0 0 1440 2560" style="position:absolute;inset:0;"></svg>
      <div id="lotus-wrap">
        <svg viewBox="0 0 400 280" width="400" height="280">
          <g fill="none" stroke="#D4A34A" stroke-width="4" stroke-linejoin="round">
            <path d="M200 40 C235 110, 235 175, 200 220 C165 175, 165 110, 200 40 Z" fill="rgba(212,163,74,0.14)"/>
            <path d="M200 220 C145 190, 105 135, 115 80 C155 110, 180 160, 200 220 Z" fill="rgba(212,163,74,0.08)"/>
            <path d="M200 220 C255 190, 295 135, 285 80 C245 110, 220 160, 200 220 Z" fill="rgba(212,163,74,0.08)"/>
            <path d="M200 220 C115 215, 65 175, 55 130 C105 145, 155 180, 200 220 Z"/>
            <path d="M200 220 C285 215, 335 175, 345 130 C295 145, 245 180, 200 220 Z"/>
            <line x1="90" y1="242" x2="310" y2="242" stroke-opacity="0.6"/>
          </g>
        </svg>
      </div>
      <div id="h1" class="word-line" style="top: 900px;">SEE CLEARLY.</div>
      <div id="h2" class="word-line" style="top: 1120px; color: var(--accent);">BEGIN.</div>
    </div>
    <div class="grain"></div>
  </section>
</div>
<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const M = Motion.film({ fps: 30, duration: 6.45, width: 1440, height: 2560, clock: 'smooth' });

(function buildEmbers() {
  const svg = document.getElementById('embers');
  let s = 9187;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = 0; i < 32; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', (100 + rnd() * 1240).toFixed(1));
    c.setAttribute('cy', (300 + rnd() * 1800).toFixed(1));
    c.setAttribute('r', (2 + rnd() * 4).toFixed(1));
    c.setAttribute('fill', '#D4A34A');
    c.setAttribute('opacity', (0.2 + rnd() * 0.45).toFixed(2));
    c.classList.add('ember');
    svg.appendChild(c);
  }
})();

M.kf('#cam8', 'scale', [[0, 1.04], [193, 1.0, 'gentleOut']]);
M.enter('#lotus-wrap', { at: 0, frames: 18, from: { y: 40, scale: 0.9, opacity: 0 } });
M.words('#h1', { at: 18, mech: 'rise', dist: 80, gaps: [6], smear: true });
M.words('#h2', { at: 96, mech: 'rise', dist: 80, gaps: [6], smear: true });

document.querySelectorAll('.ember').forEach((el, idx) => {
  const dy = -160 - (idx % 5) * 40;
  M.tl.fromTo(el, { y: 0 }, { y: dy, duration: 6.45, ease: 'none' }, 0);
});
</script>
</body>
</html>
