<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, height=2560" />
  <script src="./gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0; width: 1440px; height: 2560px; overflow: hidden;
      background: #0F0D0B; font-family: Georgia, "Times New Roman", serif;
    }
    #root {
      position: relative; width: 1440px; height: 2560px; overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #261412 0%, #120D0C 60%, #0A0807 100%);
    }
    #stage { position: absolute; inset: 0; }
    #heading {
      position: absolute; top: 300px; left: 100px; width: 1240px; text-align: center;
      color: #F2E8D5; font-size: 86px; font-weight: 700; letter-spacing: -0.02em;
    }
    .sight-card {
      position: absolute; left: 160px; width: 1120px; height: 340px;
      border: 2px solid rgba(212,163,74,0.38); border-radius: 24px;
      background: linear-gradient(135deg, rgba(38,24,20,0.88), rgba(15,13,11,0.94));
      display: flex; align-items: center; padding: 0 70px; gap: 60px;
    }
    .sight-label {
      color: #F2E8D5; font-size: 64px; font-weight: 700;
    }
    .sight-sub {
      color: #B8A88E; font-size: 46px; font-family: "DejaVu Sans", sans-serif; margin-top: 10px;
    }
    .grain {
      position: absolute; inset: 0; opacity: 0.045; pointer-events: none;
      background-image: radial-gradient(rgba(242,232,213,0.7) 1px, transparent 0);
      background-size: 6px 6px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6.1" data-width="1440" data-height="2560">
    <div id="stage" class="clip" data-start="0" data-duration="6.1" data-track-index="0">
      <div id="lantern-sweep" style="position:absolute;inset:-20%;background:radial-gradient(circle at 50% 50%, rgba(184,67,53,0.28) 0%, transparent 55%);"></div>
      <h1 id="heading">Beyond the Gates</h1>

      <div id="card1" class="sight-card" style="top: 560px;">
        <svg width="130" height="130" viewBox="0 0 120 120">
          <circle cx="52" cy="30" r="16" fill="none" stroke="#D4A34A" stroke-width="5"/>
          <path d="M52 48 Q42 75 56 105 M50 62 L78 72 L78 110" fill="none" stroke="#D4A34A" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="sight-label">Old Age</div>
          <div class="sight-sub">Time spares no one</div>
        </div>
      </div>

      <div id="card2" class="sight-card" style="top: 960px;">
        <svg width="130" height="130" viewBox="0 0 120 120">
          <path d="M25 85 L95 85 M35 85 L35 60 Q60 45 85 60 L85 85" fill="none" stroke="#B84335" stroke-width="5" stroke-linecap="round"/>
          <circle cx="48" cy="40" r="14" fill="none" stroke="#B84335" stroke-width="5"/>
        </svg>
        <div>
          <div class="sight-label">Sickness</div>
          <div class="sight-sub">No wall stops pain</div>
        </div>
      </div>

      <div id="card3" class="sight-card" style="top: 1360px;">
        <svg width="130" height="130" viewBox="0 0 120 120">
          <path d="M60 22 C74 44, 78 62, 60 80 C42 62, 46 44, 60 22 Z" fill="rgba(212,163,74,0.25)" stroke="#D4A34A" stroke-width="5"/>
          <line x1="28" y1="96" x2="92" y2="96" stroke="#B8A88E" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="sight-label">Death</div>
          <div class="sight-sub">Every life ends</div>
        </div>
      </div>
    </div>
    <div class="grain"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#stage', { scale: 1.0 }, { scale: 1.05, duration: 6.1, ease: 'none' }, 0);
    tl.fromTo('#lantern-sweep', { x: -240, y: -180 }, { x: 240, y: 180, duration: 6.1, ease: 'sine.inOut' }, 0);
    tl.fromTo('#heading', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0);
    tl.fromTo('#card1', { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 1.2);
    tl.fromTo('#card2', { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 2.6);
    tl.fromTo('#card3', { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 4.0);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
