<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, height=2560" />
  <script src="./gsap.min.js"></script>
  <style>
    :root {
      --ground: #0F0D0B;
      --stone: #1B1612;
      --ink: #F2E8D5;
      --gold: #D4A34A;
      --crimson: #B84335;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0; width: 1440px; height: 2560px; overflow: hidden;
      background: var(--ground); font-family: Georgia, "Times New Roman", serif;
    }
    #root {
      position: relative; width: 1440px; height: 2560px; overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #2B1F13 0%, #140F0B 55%, #0F0D0B 100%);
    }
    #palace-stage {
      position: absolute; inset: 0;
    }
    #title-card {
      position: absolute; top: 320px; left: 120px; width: 1200px; text-align: center;
      color: var(--ink); font-size: 92px; font-weight: 700; letter-spacing: -0.02em;
      text-shadow: 0 8px 40px rgba(0,0,0,0.8);
    }
    #subtitle {
      position: absolute; top: 445px; left: 160px; width: 1120px; text-align: center;
      color: var(--gold); font-size: 56px; font-family: "DejaVu Sans", sans-serif;
      font-weight: 500; letter-spacing: 0.04em;
    }
    .grain {
      position: absolute; inset: 0; opacity: 0.04; pointer-events: none;
      background-image: radial-gradient(rgba(242,232,213,0.7) 1px, transparent 0);
      background-size: 6px 6px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="13.1" data-width="1440" data-height="2560">
    <div id="palace-stage" class="clip" data-start="0" data-duration="13.1" data-track-index="0">
      <svg id="palace-svg" viewBox="0 0 1440 2560" width="1440" height="2560">
        <defs>
          <radialGradient id="amberGlow" cx="50%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#D4A34A" stop-opacity="0.32"/>
            <stop offset="55%" stop-color="#9E3A2E" stop-opacity="0.10"/>
            <stop offset="100%" stop-color="#0F0D0B" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="archGold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#D4A34A" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#5C4018" stop-opacity="0.25"/>
          </linearGradient>
        </defs>
        <rect width="1440" height="2560" fill="url(#amberGlow)"/>
        <!-- Outer Palace Arch -->
        <g id="arch-outer">
          <path d="M180 2050 L180 960 Q180 620 720 480 Q1260 620 1260 960 L1260 2050" fill="none" stroke="url(#archGold)" stroke-width="6"/>
          <path d="M230 2050 L230 980 Q230 675 720 545 Q1210 675 1210 980 L1210 2050" fill="none" stroke="#D4A34A" stroke-width="2" stroke-opacity="0.45"/>
        </g>
        <!-- Inner Palace Pillars & Gates -->
        <g id="palace-walls" opacity="0.92">
          <rect x="260" y="960" width="36" height="1080" fill="#2A1F14" stroke="#D4A34A" stroke-width="2" stroke-opacity="0.5"/>
          <rect x="1144" y="960" width="36" height="1080" fill="#2A1F14" stroke="#D4A34A" stroke-width="2" stroke-opacity="0.5"/>
          <path d="M360 1980 L360 1120 Q360 850 720 740 Q1080 850 1080 1120 L1080 1980 Z" fill="#18120D" stroke="#D4A34A" stroke-width="3" stroke-opacity="0.6"/>
        </g>
        <!-- Young Prince Silhouette -->
        <g id="prince" transform="translate(720, 1520)">
          <ellipse cx="0" cy="340" rx="190" ry="28" fill="#D4A34A" opacity="0.16"/>
          <!-- Crown / Turban -->
          <path d="M-36 -255 Q0 -310 36 -255 L44 -225 L-44 -225 Z" fill="#D4A34A"/>
          <circle cx="0" cy="-275" r="9" fill="#F2E8D5"/>
          <!-- Head & Robes -->
          <circle cx="0" cy="-190" r="46" fill="#231A12" stroke="#D4A34A" stroke-width="2"/>
          <path d="M-70 -130 Q0 -150 70 -130 L120 330 L-120 330 Z" fill="#2B1F16" stroke="#D4A34A" stroke-width="2.5"/>
          <path d="M-55 -95 Q0 -30 65 -90" fill="none" stroke="#D4A34A" stroke-width="4" stroke-opacity="0.8"/>
        </g>
        <!-- Floating Petals Layer -->
        <g id="petals"></g>
      </svg>
    </div>
    <h1 id="title-card" class="clip" data-start="0" data-duration="13.1" data-track-index="1">Prince Siddhartha</h1>
    <div id="subtitle" class="clip" data-start="0" data-duration="13.1" data-track-index="2">Sheltered behind golden walls</div>
    <div class="grain"></div>
  </div>
  <script>
    (function buildPetals() {
      const g = document.getElementById('petals');
      let s = 1337;
      const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
      for (let i = 0; i < 28; i++) {
        const el = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        el.setAttribute('cx', (180 + rnd() * 1080).toFixed(1));
        el.setAttribute('cy', (650 + rnd() * 1250).toFixed(1));
        el.setAttribute('rx', (6 + rnd() * 7).toFixed(1));
        el.setAttribute('ry', (3 + rnd() * 4).toFixed(1));
        el.setAttribute('fill', i % 2 === 0 ? '#D4A34A' : '#B84335');
        el.setAttribute('opacity', (0.25 + rnd() * 0.45).toFixed(2));
        el.classList.add('petal');
        g.appendChild(el);
      }
    })();

    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#palace-svg', { scale: 1.0, transformOrigin: '50% 50%' }, { scale: 1.07, duration: 13.1, ease: 'none' }, 0);
    tl.fromTo('#title-card', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0.15);
    tl.fromTo('#subtitle', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0.45);
    tl.fromTo('#prince', { y: 30, opacity: 0.2 }, { y: 0, opacity: 1, duration: 0.8, ease: 'power2.out' }, 0);

    document.querySelectorAll('.petal').forEach((p, i) => {
      const dx = (i % 2 === 0 ? 1 : -1) * (40 + (i % 4) * 18);
      const dy = 120 + (i % 5) * 35;
      tl.fromTo(p, { x: 0, y: 0, rotation: 0 }, { x: dx, y: dy, rotation: 90 + i * 12, duration: 13.1, ease: 'none' }, 0);
    });

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
