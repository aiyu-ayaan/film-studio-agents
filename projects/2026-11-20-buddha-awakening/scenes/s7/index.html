<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, height=2560" />
  <script src="./gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0; width: 1440px; height: 2560px; overflow: hidden;
      background: #0F0D0B; font-family: Georgia, "Times New Roman", serif;
    }
    #root {
      position: relative; width: 1440px; height: 2560px; overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #261E14 0%, #110E0B 62%, #0A0807 100%);
    }
    #stage { position: absolute; inset: 0; }
    #heading {
      position: absolute; top: 260px; left: 100px; width: 1240px; text-align: center;
      color: #F2E8D5; font-size: 86px; font-weight: 700; letter-spacing: -0.02em;
    }
    .teaching-card {
      position: absolute; left: 140px; width: 1160px; height: 390px;
      border: 2px solid rgba(212,163,74,0.45); border-radius: 28px;
      background: linear-gradient(135deg, rgba(32,25,18,0.92), rgba(15,13,11,0.96));
      display: flex; align-items: center; padding: 0 70px; gap: 55px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    .t-title {
      color: #D4A34A; font-size: 62px; font-weight: 700;
    }
    .t-desc {
      color: #F2E8D5; font-size: 44px; font-family: "DejaVu Sans", sans-serif;
      margin-top: 14px; line-height: 1.3;
    }
    .grain {
      position: absolute; inset: 0; opacity: 0.04; pointer-events: none;
      background-image: radial-gradient(rgba(242,232,213,0.7) 1px, transparent 0);
      background-size: 6px 6px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="18.5" data-width="1440" data-height="2560">
    <div id="stage" class="clip" data-start="0" data-duration="18.5" data-track-index="0">
      <h1 id="heading">His Core Teachings</h1>

      <!-- Teaching 1: Middle Way -->
      <div id="t1" class="teaching-card" style="top: 480px;">
        <svg width="140" height="140" viewBox="0 0 120 120">
          <line x1="60" y1="20" x2="60" y2="100" stroke="#D4A34A" stroke-width="5" stroke-linecap="round"/>
          <line x1="20" y1="42" x2="100" y2="42" stroke="#D4A34A" stroke-width="5" stroke-linecap="round"/>
          <circle cx="24" cy="68" r="14" fill="none" stroke="#F2E8D5" stroke-width="4"/>
          <circle cx="96" cy="68" r="14" fill="none" stroke="#F2E8D5" stroke-width="4"/>
        </svg>
        <div>
          <div class="t-title">The Middle Way</div>
          <div class="t-desc">Balance between indulgence and self-harm</div>
        </div>
      </div>

      <!-- Teaching 2: Let Go of Craving -->
      <div id="t2" class="teaching-card" style="top: 930px;">
        <svg width="140" height="140" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="38" fill="none" stroke="#B84335" stroke-width="5" stroke-dasharray="14 10"/>
          <path d="M40 60 L80 60 M60 40 L60 80" stroke="#D4A34A" stroke-width="5" stroke-linecap="round" transform="rotate(45 60 60)"/>
        </svg>
        <div>
          <div class="t-title">End of Suffering</div>
          <div class="t-desc">Suffering rises from craving — let go</div>
        </div>
      </div>

      <!-- Teaching 3: Mindfulness & Compassion -->
      <div id="t3" class="teaching-card" style="top: 1380px;">
        <svg width="140" height="140" viewBox="0 0 120 120">
          <path d="M60 22 C78 48, 78 78, 60 96 C42 78, 42 48, 60 22 Z" fill="rgba(212,163,74,0.22)" stroke="#D4A34A" stroke-width="5"/>
          <path d="M60 96 C32 82, 20 55, 28 34 C44 48, 52 70, 60 96 Z" fill="none" stroke="#D4A34A" stroke-width="4"/>
          <path d="M60 96 C88 82, 100 55, 92 34 C76 48, 68 70, 60 96 Z" fill="none" stroke="#D4A34A" stroke-width="4"/>
        </svg>
        <div>
          <div class="t-title">Mind & Compassion</div>
          <div class="t-desc">Peace is built inside your own mind</div>
        </div>
      </div>
    </div>
    <div class="grain"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#stage', { scale: 1.0 }, { scale: 1.04, duration: 18.5, ease: 'none' }, 0);
    tl.fromTo('#heading', { y: 18, opacity: 0.85 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0);
    tl.fromTo('#t1', { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 1.6);
    tl.fromTo('#t2', { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 5.6);
    tl.fromTo('#t3', { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 11.2);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
