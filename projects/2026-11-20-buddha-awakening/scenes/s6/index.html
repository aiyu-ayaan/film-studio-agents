<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, height=2560" />
  <script src="./gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0; width: 1440px; height: 2560px; overflow: hidden;
      background: #0F0D0B; font-family: Georgia, "Times New Roman", serif;
    }
    #root {
      position: relative; width: 1440px; height: 2560px; overflow: hidden;
      background: radial-gradient(circle at 50% 52%, #3D2B14 0%, #19130C 55%, #0D0A08 100%);
    }
    #stage { position: absolute; inset: 0; }
    #title {
      position: absolute; top: 320px; left: 100px; width: 1240px; text-align: center;
      color: #D4A34A; font-size: 96px; font-weight: 700; letter-spacing: -0.02em;
      text-shadow: 0 10px 50px rgba(212,163,74,0.35);
    }
    #sub {
      position: absolute; top: 450px; left: 140px; width: 1160px; text-align: center;
      color: #F2E8D5; font-size: 54px; font-family: "DejaVu Sans", sans-serif;
    }
    .grain {
      position: absolute; inset: 0; opacity: 0.04; pointer-events: none;
      background-image: radial-gradient(rgba(242,232,213,0.7) 1px, transparent 0);
      background-size: 6px 6px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6.5" data-width="1440" data-height="2560">
    <div id="stage" class="clip" data-start="0" data-duration="6.5" data-track-index="0">
      <svg viewBox="0 0 1440 2560" width="1440" height="2560">
        <!-- Expanding Dawn Halo -->
        <g id="halo" transform="translate(720, 1340)">
          <circle cx="0" cy="0" r="460" fill="rgba(212,163,74,0.10)" stroke="#D4A34A" stroke-opacity="0.35" stroke-width="2"/>
          <circle cx="0" cy="0" r="340" fill="rgba(212,163,74,0.14)" stroke="#D4A34A" stroke-opacity="0.55" stroke-width="3"/>
          <circle cx="0" cy="0" r="220" fill="rgba(212,163,74,0.22)"/>
        </g>
        <!-- Lotus Throne -->
        <g id="lotus" transform="translate(720, 1660)" fill="rgba(212,163,74,0.18)" stroke="#D4A34A" stroke-width="3">
          <path d="M0 0 C-70 -40, -140 -20, -190 20 C-110 40, -40 30, 0 0 Z"/>
          <path d="M0 0 C70 -40, 140 -20, 190 20 C110 40, 40 30, 0 0 Z"/>
          <path d="M0 10 C-40 -60, -40 -100, 0 -130 C40 -100, 40 -60, 0 10 Z"/>
        </g>
        <!-- Awakened Buddha Silhouette -->
        <g id="buddha" transform="translate(720, 1480)">
          <circle cx="0" cy="-190" r="22" fill="#F2E8D5" opacity="0.9"/>
          <circle cx="0" cy="-140" r="48" fill="#17120D" stroke="#D4A34A" stroke-width="3"/>
          <path d="M-70 -75 Q0 -95 70 -75 L140 140 Q0 180 -140 140 Z" fill="#17120D" stroke="#D4A34A" stroke-width="3"/>
        </g>
      </svg>
    </div>
    <h1 id="title" class="clip" data-start="0" data-duration="6.5" data-track-index="1">THE AWAKENED ONE</h1>
    <div id="sub" class="clip" data-start="0" data-duration="6.5" data-track-index="2">At dawn, his mind went still</div>
    <div class="grain"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#stage', { scale: 0.98 }, { scale: 1.06, duration: 6.5, ease: 'none' }, 0);
    tl.fromTo('#halo', { scale: 0.65, opacity: 0.3, transformOrigin: '50% 50%' }, { scale: 1.15, opacity: 1, duration: 2.2, ease: 'power3.out' }, 0);
    tl.fromTo('#title', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.6);
    tl.fromTo('#sub', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0.2);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
