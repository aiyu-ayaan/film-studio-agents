<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, height=2560" />
  <script src="./gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0; width: 1440px; height: 2560px; overflow: hidden;
      background: #0F0D0B; font-family: Georgia, "Times New Roman", serif;
    }
    #root {
      position: relative; width: 1440px; height: 2560px; overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #161C2E 0%, #0F0D0B 65%, #070605 100%);
    }
    #stage { position: absolute; inset: 0; }
    #title {
      position: absolute; top: 310px; left: 120px; width: 1200px; text-align: center;
      color: #F2E8D5; font-size: 84px; font-weight: 700; letter-spacing: -0.02em;
    }
    #sub {
      position: absolute; top: 430px; left: 160px; width: 1120px; text-align: center;
      color: #D4A34A; font-size: 52px; font-family: "DejaVu Sans", sans-serif;
    }
    .grain {
      position: absolute; inset: 0; opacity: 0.045; pointer-events: none;
      background-image: radial-gradient(rgba(242,232,213,0.7) 1px, transparent 0);
      background-size: 6px 6px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8.3" data-width="1440" data-height="2560">
    <div id="stage" class="clip" data-start="0" data-duration="8.3" data-track-index="0">
      <svg viewBox="0 0 1440 2560" width="1440" height="2560">
        <!-- Crescent Moon -->
        <g id="moon" transform="translate(1060, 620)">
          <circle cx="0" cy="0" r="85" fill="#F2E8D5" opacity="0.88"/>
          <circle cx="32" cy="-18" r="78" fill="#131724"/>
        </g>
        <!-- Stars -->
        <g id="stars"></g>
        <!-- Forest horizon -->
        <path d="M0 1750 Q360 1620 720 1720 Q1080 1820 1440 1690 L1440 2560 L0 2560 Z" fill="#0B0908"/>
        <!-- Stone Pedestal & Left-Behind Crown -->
        <g id="pedestal" transform="translate(480, 1520)">
          <rect x="-110" y="60" width="220" height="320" rx="10" fill="#1D1814" stroke="#B8A88E" stroke-opacity="0.35" stroke-width="3"/>
          <g id="crown">
            <path d="M-75 55 L-90 -25 L-35 15 L0 -45 L35 15 L90 -25 L75 55 Z" fill="#D4A34A" stroke="#F2E8D5" stroke-width="2"/>
            <rect x="-78" y="45" width="156" height="16" rx="4" fill="#B58530"/>
          </g>
        </g>
        <!-- Cloaked Figure Walking Away -->
        <g id="walker" transform="translate(860, 1560)">
          <circle cx="0" cy="-160" r="34" fill="#181412" stroke="#B8A88E" stroke-width="2"/>
          <path d="M-48 -115 Q0 -135 48 -115 L85 260 L-75 260 Z" fill="#14110F" stroke="#D4A34A" stroke-opacity="0.55" stroke-width="2.5"/>
        </g>
      </svg>
    </div>
    <h1 id="title" class="clip" data-start="0" data-duration="8.3" data-track-index="1">Age Twenty-Nine</h1>
    <div id="sub" class="clip" data-start="0" data-duration="8.3" data-track-index="2">He walked away from the crown</div>
    <div class="grain"></div>
  </div>
  <script>
    (function buildStars() {
      const g = document.getElementById('stars');
      let s = 5501;
      const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
      for (let i = 0; i < 40; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', (60 + rnd() * 1320).toFixed(1));
        c.setAttribute('cy', (520 + rnd() * 900).toFixed(1));
        c.setAttribute('r', (1.5 + rnd() * 3).toFixed(1));
        c.setAttribute('fill', '#F2E8D5');
        c.setAttribute('opacity', (0.2 + rnd() * 0.6).toFixed(2));
        g.appendChild(c);
      }
    })();

    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#stage', { scale: 1.0 }, { scale: 1.06, duration: 8.3, ease: 'none' }, 0);
    tl.fromTo('#title', { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.1);
    tl.fromTo('#sub', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.35);
    tl.fromTo('#walker', { x: 0, scale: 1.0 }, { x: 220, y: -40, scale: 0.78, duration: 8.3, ease: 'sine.inOut' }, 0);
    tl.fromTo('#crown', { opacity: 1 }, { opacity: 0.45, duration: 8.3, ease: 'none' }, 0);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
