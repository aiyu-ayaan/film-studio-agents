<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, height=2560" />
  <script src="./gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0; width: 1440px; height: 2560px; overflow: hidden;
      background: #0F0D0B; font-family: Georgia, "Times New Roman", serif;
    }
    #root {
      position: relative; width: 1440px; height: 2560px; overflow: hidden;
      background: radial-gradient(circle at 50% 48%, #221B12 0%, #110E0B 60%, #0A0807 100%);
    }
    #stage { position: absolute; inset: 0; }
    #title {
      position: absolute; top: 300px; left: 120px; width: 1200px; text-align: center;
      color: #F2E8D5; font-size: 82px; font-weight: 700; letter-spacing: -0.02em;
    }
    #sub {
      position: absolute; top: 415px; left: 160px; width: 1120px; text-align: center;
      color: #D4A34A; font-size: 50px; font-family: "DejaVu Sans", sans-serif;
    }
    .grain {
      position: absolute; inset: 0; opacity: 0.045; pointer-events: none;
      background-image: radial-gradient(rgba(242,232,213,0.7) 1px, transparent 0);
      background-size: 6px 6px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="10.2" data-width="1440" data-height="2560">
    <div id="stage" class="clip" data-start="0" data-duration="10.2" data-track-index="0">
      <svg viewBox="0 0 1440 2560" width="1440" height="2560">
        <!-- Time-lapse Sun/Moon Orbit -->
        <path d="M220 1250 A 500 500 0 0 1 1220 1250" fill="none" stroke="#D4A34A" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="10 14"/>
        <circle id="orb" cx="220" cy="1250" r="36" fill="#D4A34A" opacity="0.85"/>

        <!-- Sacred Bodhi Tree Canopy & Trunk -->
        <g id="bodhi-tree">
          <path d="M720 1840 L720 1050" stroke="#5A4224" stroke-width="26" stroke-linecap="round"/>
          <path d="M720 1280 Q560 1120 420 1040" fill="none" stroke="#6E512C" stroke-width="14" stroke-linecap="round"/>
          <path d="M720 1260 Q880 1100 1020 1020" fill="none" stroke="#6E512C" stroke-width="14" stroke-linecap="round"/>
          <path d="M720 1120 Q600 940 500 840" fill="none" stroke="#856235" stroke-width="10" stroke-linecap="round"/>
          <path d="M720 1100 Q840 920 940 830" fill="none" stroke="#856235" stroke-width="10" stroke-linecap="round"/>
          <circle cx="720" cy="920" r="240" fill="rgba(212,163,74,0.08)" stroke="#D4A34A" stroke-opacity="0.35" stroke-width="2"/>
          <circle cx="490" cy="1000" r="160" fill="rgba(212,163,74,0.07)" stroke="#D4A34A" stroke-opacity="0.28" stroke-width="2"/>
          <circle cx="950" cy="990" r="160" fill="rgba(212,163,74,0.07)" stroke="#D4A34A" stroke-opacity="0.28" stroke-width="2"/>
        </g>

        <!-- Meditating Silhouette -->
        <g id="meditator" transform="translate(720, 1730)">
          <ellipse cx="0" cy="120" rx="220" ry="26" fill="#D4A34A" opacity="0.18"/>
          <circle cx="0" cy="-120" r="40" fill="#18130E" stroke="#D4A34A" stroke-width="2.5"/>
          <path d="M-55 -65 Q0 -80 55 -65 L105 95 Q0 125 -105 95 Z" fill="#18130E" stroke="#D4A34A" stroke-width="2.5"/>
        </g>
      </svg>
    </div>
    <h1 id="title" class="clip" data-start="0" data-duration="10.2" data-track-index="1">Six Years of Seeking</h1>
    <div id="sub" class="clip" data-start="0" data-duration="10.2" data-track-index="2">Beneath the Bodhi Tree</div>
    <div class="grain"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#stage', { scale: 1.0 }, { scale: 1.06, duration: 10.2, ease: 'none' }, 0);
    tl.fromTo('#title', { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.1);
    tl.fromTo('#sub', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.35);
    tl.fromTo('#bodhi-tree', { scale: 0.88, opacity: 0.3, transformOrigin: '50% 90%' }, { scale: 1.0, opacity: 1, duration: 3.5, ease: 'power2.out' }, 0);

    // Move orb along semicircular arc deterministically
    const orbObj = { angle: Math.PI };
    tl.to(orbObj, {
      angle: 0,
      duration: 10.2,
      ease: 'none',
      onUpdate: () => {
        const cx = 720 + 500 * Math.cos(orbObj.angle);
        const cy = 1250 - 500 * Math.sin(orbObj.angle);
        const orb = document.getElementById('orb');
        orb.setAttribute('cx', cx.toFixed(1));
        orb.setAttribute('cy', cy.toFixed(1));
      }
    }, 0);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
